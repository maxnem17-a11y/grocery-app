<style>
  :root{ --bg:#fafaf7; --card:#fff; --ink:#1c1c1c; --muted:#6b7280; --line:#e7e5e0; }
  html,body{ background:var(--bg); color:var(--ink); }
  body{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; }

  input[type="checkbox"]{ accent-color:#1c1c1c; }

  .pill{ border:1px solid #d6d3d0; background:white; color:#525252; padding:.25rem .65rem; border-radius:.5rem; font-size:.75rem; line-height:1.25; transition: all .12s; }
  .pill:hover{ background:#f5f5f4; }
  .pill[data-active="true"]{ background:#1c1c1c; color:white; border-color:#1c1c1c; }
  .navtab{ font-size:.875rem; padding:.5rem .75rem; margin-bottom:-1px; border-bottom:2px solid transparent; color:#6b7280; transition: color .12s, border-color .12s; }
  .navtab[data-active="true"]{ color:#1c1c1c; border-bottom-color:#1c1c1c; font-weight:600; }
  .navtab:hover{ color:#1c1c1c; }
  textarea{ font-family: ui-monospace, monospace; }

}

// ===== Allergen rules =====
const KHALIL_BLOCK = [
  "egg","eggs","butter","cream","cheese","yoghurt","yogurt","ghee","paneer","feta","ricotta","mozzarella","parmesan","cheddar","pecorino","creme fraiche","mascarpone","crème","crème fraîche",
  "flour","breadcrumb","panko","pasta","spaghetti","penne","fettuccine","orzo","fusilli","udon","ramen","seitan","couscous","bulgur","semolina","barley","filo","pastry","wheat","gnocchi","naan","chapati","roti","brioche","pitta",
  "lentil","lentils","dal","masoor","toor","urad","moong","mangetout","sugar snap","sugarsnap","chickpea","peas","split peas","gram flour","besan","kidney bean","cannellini","butter bean","borlotti","haricot","edamame","broad bean","baked bean","mung bean","black bean",
  "avocado",
  "beef","steak","mince beef","ground beef","veal",
  "walnut","pecan","cashew","almond","pistachio","hazelnut","brazil nut","macadamia","pine nut","pine kernel",
];
const KHALIL_UNCERTAIN = ["soy sauce","light soy sauce","oat milk","oat drink","oatly","soba"];
const MAX_BLOCK = ["chicken","beef","pork","bacon","ham","sausage","lamb","mutton","steak","chorizo","prosciutto","pancetta","duck","turkey","veal","gammon"];
const EMILY_BLOCK = ["pork","bacon","ham","prosciutto","pancetta","chorizo","gammon"];
const KHALIL_SAFE_PHRASES = ["peanut butter","peanut","peanuts","coconut milk","coconut cream","coconut butter","coconut yoghurt","peach","peaches","apricot","apricots"];

function lc(s){ return (s||"").toString().toLowerCase(); }
function ingredientText(ing){ return lc(ing?.item||"") + " " + lc(ing?.pantry_match||""); }
function hasToken(text, tok){
  if (tok.includes(" ")) return text.includes(tok);
  const re = new RegExp("(^|[^a-z])" + tok.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "(s|es)?([^a-z]|$)");
  return re.test(text);
}
function isGreenBean(text){ return ["green bean","french bean","runner bean","string bean"].some(p=>text.includes(p)); }
function isDairyMilk(text){
  if (!text.includes("milk")) return false;
  const plant = ["coconut milk","almond milk","oat milk","soya milk","soy milk","cashew milk","hazelnut milk","rice milk","hemp milk","pea milk","plant milk","plant-milk","non-dairy milk","dairy-free milk"];
  return !plant.some(p=>text.includes(p));
}
function flagsForRecipe(recipe){
  const flags = { khalil:"safe", khalilReason:[], khalilUncertain:[], max:"safe", maxReason:[], emily:"safe", emilyReason:[] };
  for (const ing of recipe.ingredients || []) {
    const txt = ingredientText(ing);
    let blockedThis = false;
    if (isDairyMilk(txt)) { flags.khalil="blocked"; flags.khalilReason.push(`${ing.item} (dairy milk)`); blockedThis = true; }
    const greenBean = isGreenBean(txt);
    if (!blockedThis) {
      for (const tok of KHALIL_BLOCK) {
        if (["butter","cream","milk"].includes(tok) && KHALIL_SAFE_PHRASES.some(sp => txt.includes(sp))) continue;
        if (tok === "bean" && greenBean) continue;
        if (hasToken(txt, tok)) { flags.khalil="blocked"; flags.khalilReason.push(`${ing.item} (${tok})`); break; }
      }
    }
    for (const tok of KHALIL_UNCERTAIN) {
      if (hasToken(txt, tok)) { flags.khalilUncertain.push(`${ing.item} (${tok})`); if (flags.khalil === "safe") flags.khalil = "check"; }
    }
    for (const tok of MAX_BLOCK) if (hasToken(txt, tok)) { flags.max="blocked"; flags.maxReason.push(`${ing.item} (${tok})`); break; }
    for (const tok of EMILY_BLOCK) if (hasToken(txt, tok)) { flags.emily="blocked"; flags.emilyReason.push(`${ing.item} (${tok})`); break; }
  }
  return flags;
}
function audienceFromFlags(f){
  if (f.khalil === "safe") return "whole-household";
  if (f.khalil === "check") return "check";
  return "adults-only";
}

// ===== Pantry math =====
function daysSince(dateStr){
  if (!dateStr) return 0;
  const d = new Date(dateStr + "T12:00:00Z");
  return Math.max(0, Math.floor((TODAY - d)/(1000*60*60*24)));
}
function decayPerDay(category){
  const c = lc(category);
  if (c.includes("produce")) return 20;
  if (c.includes("dairy") || c === "protein") return 10;
  if (c.includes("frozen")) return 5/30;
  if (c.includes("seasoning") || c.includes("dry") || c.includes("tinned") || c.includes("condiment") || c.includes("nuts")) return 4/7;
  return 5;
}
function decayed(item){
  const d = daysSince(item.purchased);
  const v = (item.confidence ?? 90) - d * decayPerDay(item.category);
  return Math.max(0, Math.round(v));
}
function daysUntilExpiry(item){
  if (!item.expires) return null;
  const d = new Date(item.expires + "T12:00:00Z");
  return Math.round((d - TODAY)/(1000*60*60*24));
}

    ["dishoom","dishoom"],
    ["africana","africana"],
    ["west-winds","west_winds"],
    ["saved-links","saved_links"],
    ["instagram-recipes","instagram_recipes"],
  ];
  const all = [];
  for (const [label, key] of sources) {
    const arr = RAW[key] || [];
    for (const r of arr) all.push({...r, _source_file: label});
  }
  return all;
}
const RECIPES = loadRecipes();

function pantryMatchSet(pantry, alsoOut){
  const s = new Set();
  for (const p of pantry) {
    if (alsoOut && alsoOut.has(p.item)) continue;
    const k = lc(p.item).trim();
    s.add(k);
    s.add(k.replace(/\s*\(.*?\)\s*/g,"").trim());
  }
  // Implicit-staples: ingredients assumed present even if not listed in pantry JSON.
  // Includes common name variants so recipe ingredient strings match correctly.
  for (const x of [
    "salt", "sea salt", "flaked sea salt", "fine sea salt",
    "pepper", "black pepper", "ground black pepper", "white pepper",
    "water",
    "sugar", "caster sugar", "granulated sugar", "brown sugar", "muscovado sugar", "icing sugar",
    "olive oil", "extra virgin olive oil",
    "vegetable oil", "rapeseed oil", "sunflower oil", "groundnut oil", "oil",
    "peanut butter",
  ]) s.add(x);
  return s;
}
function makeability(recipe, matchSet){
  const ings = recipe.ingredients || [];
  if (!ings.length) return { pct:0, have:[], missing:[] };
  const have=[], missing=[];
  for (const i of ings) {
    const match = (i.pantry_match || i.item || "").toLowerCase().trim();
    const cleanMatch = match.replace(/\s*\(.*?\)\s*/g,"").trim();
    if (matchSet.has(match) || matchSet.has(cleanMatch)) have.push(i);
    else missing.push(i);
  }
  return { pct: Math.round(100*have.length/ings.length), have, missing };
}
function leverageScore(recipes, matchSet, limit){
  // For each missing ingredient across all not-yet-makeable recipes, list every
  // recipe it appears in and the makeability boost it would give each one.
  // Ranked by recipe_count (broadest impact) then average boost.
  const baseline = recipes.map(r => makeability(r, matchSet).pct);
  const ingMap = new Map(); // key -> { label, recipes: [{name, before, after, id}] }
  recipes.forEach((r, idx) => {
    if (baseline[idx] >= 70) return; // recipe already makeable; skip
    const m = makeability(r, matchSet);
    // Unique missing keys for this recipe
    const missingKeys = new Set();
    for (const i of m.missing) {
      const mm = (i.pantry_match || i.item || "").toLowerCase().trim();
      const cm = mm.replace(/\s*\(.*?\)\s*/g, "").trim();
      if (!cm) continue;
      if (missingKeys.has(cm)) continue;
      missingKeys.add(cm);
      const label = i.pantry_match || i.item;
      // Compute the after-% if we had this ingredient
      const augmented = new Set(matchSet); augmented.add(cm);
      const after = makeability(r, augmented).pct;
      if (!ingMap.has(cm)) ingMap.set(cm, { label, recipes: [] });
      ingMap.get(cm).recipes.push({
        name: r.name,
        before: baseline[idx],
        after,
        id: r.id,
      });
    }
  });
  const out = [];
  for (const [key, v] of ingMap.entries()) {
    const recipeCount = v.recipes.length;
    const unlockedTo70 = v.recipes.filter(r => r.after >= 70).length;
    const avgBoost = Math.round(v.recipes.reduce((s, r) => s + (r.after - r.before), 0) / recipeCount);
    const sortedRecipes = v.recipes.slice().sort((a, b) => b.after - a.after);
    out.push({
      ingredient: v.label,
      key,
      recipeCount,
      unlockedTo70,
      avgBoost,
      unlockedRecipes: sortedRecipes,
      // Back-compat fields for the planner caller
      unlocks: unlockedTo70,
      mentions: recipeCount,
    });
  }
  out.sort((a, b) => b.recipeCount - a.recipeCount || b.avgBoost - a.avgBoost);
  return limit ? out.slice(0, limit) : out;
}

// ===== UI =====
function Chip({tone="neutral", children, title}){
  const map = {
    neutral:"bg-stone-50 text-stone-700",
    ok:"bg-emerald-50 text-emerald-700 border-emerald-200",
    warn:"bg-amber-50 text-amber-800 border-amber-200",
    danger:"bg-red-50 text-red-700 border-red-200",
    info:"bg-blue-50 text-blue-700 border-blue-200",
    accent:"bg-violet-50 text-violet-700 border-violet-200",
  };
  return <span className={`chip ${map[tone]||map.neutral}`} title={title}>{children}</span>;
}
function AudienceTag({a}){
  if (a==="whole-household") return <Chip tone="ok">✅ Whole household</Chip>;
  if (a==="check") return <Chip tone="warn">⚠️ Check</Chip>;
  return <Chip tone="info">👨‍👩 Adults only</Chip>;
}
function Bar({pct, color}){
  const c = color || (pct>=70?"#16a34a":pct>=40?"#d97706":"#dc2626");
  return <div className="bar"><div style={{width:`${pct}%`, background:c}}/></div>;
}
function Stat({label, value, tone, sub}){
  const tmap = { ok:"text-emerald-700", warn:"text-amber-700", danger:"text-red-700", info:"text-blue-700" };
  return <div className="card px-4 py-3">
    <div className="text-xs text-stone-500 uppercase tracking-wider">{label}</div>
    <div className={`text-2xl font-semibold mt-0.5 ${tmap[tone]||""}`}>{value}</div>
    {sub && <div className="text-xs text-stone-500 mt-0.5">{sub}</div>}
  </div>;
}
function Section({title, subtitle, tone, children, collapsible=false, defaultOpen=true}){
  const map = { warn:"border-amber-200 bg-amber-50/40", ok:"border-emerald-200 bg-emerald-50/30", info:"border-blue-200 bg-blue-50/30", accent:"border-violet-200 bg-violet-50/30", neutral:"" };
  const [open, setOpen] = useState(defaultOpen);
  const isOpen = collapsible ? open : true;
  const headerProps = collapsible ? {
    role: "button",
    tabIndex: 0,
    onClick: ()=> setOpen(o=>!o),
    onKeyDown: (e)=> { if (e.key==="Enter" || e.key===" ") { e.preventDefault(); setOpen(o=>!o); } },
    "aria-expanded": isOpen,
    className: "flex items-baseline justify-between flex-wrap gap-2 cursor-pointer select-none "+(isOpen?"mb-3":"mb-0"),
  } : { className: "flex items-baseline justify-between mb-3 flex-wrap gap-2" };
  return <div className={`card p-4 ${map[tone]||""}`}>
    <div {...headerProps}>
      <h3 className="text-lg font-semibold flex items-center gap-2">
        {collapsible && <span className="text-stone-400 text-sm w-3 inline-block">{isOpen ? "▼" : "▶"}</span>}
        {title}
      </h3>
      {subtitle && <span className="text-xs text-stone-500">{subtitle}</span>}
    </div>
    {isOpen && children}
  </div>;
}

// ===== Pantry view =====
function PantryView({pantry, outOfStock, toggleOutOfStock}){
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("all");
  const rows = useMemo(()=> pantry.map(p => {
    const conf = decayed(p);
    const dExp = daysUntilExpiry(p);
    const flag = p.allergen_flag || "household_safe";
    return {...p, _conf:conf, _dExp:dExp, _flag:flag, _out: outOfStock.has(p.item)};
  }), [pantry, outOfStock]);
  const filtered = rows.filter(r => {
    if (q && !lc(r.item).includes(lc(q))) return false;
    if (filter==="expiring") return r._dExp!==null && r._dExp <= 5 && !r._out;
    if (filter==="low") return r._conf < 30 && !r._out;
    if (filter==="son") return r._flag !== "household_safe";
    if (filter==="out") return r._out;
    return true;
  });
  const counts = {
    total: rows.length,
    expiring: rows.filter(r=>r._dExp!==null && r._dExp <= 5 && !r._out).length,
    low: rows.filter(r=>r._conf<30 && !r._out).length,
    son: rows.filter(r=>r._flag!=="household_safe").length,
    out: rows.filter(r=>r._out).length,
  };
  return <>
    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-4">
      <Stat label="Items tracked" value={counts.total} />
      <Stat label="Expiring ≤5d" value={counts.expiring} tone={counts.expiring>0?"warn":"ok"} />
      <Stat label="Conf. <30%" value={counts.low} tone={counts.low>0?"warn":"ok"} />
      <Stat label="Khalil-allergen" value={counts.son} tone="info" />
      <Stat label="Marked out" value={counts.out} tone={counts.out>0?"danger":"ok"} />
    </div>
    <div className="flex flex-wrap gap-2 items-center mb-3">
      <input className="border border-stone-300 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[160px]" placeholder="Search pantry…" value={q} onChange={e=>setQ(e.target.value)} />
      <div className="flex flex-wrap gap-1">
        {[["all","All"],["expiring","Expiring"],["low","Low conf"],["son","Khalil allergens"],["out","Marked out"]].map(([k,l])=>
          <button key={k} data-active={filter===k} onClick={()=>setFilter(k)} className="pill">{l}</button>
        )}
      </div>
    </div>
    <div className="card overflow-hidden">
      <div className="grid grid-cols-12 gap-2 text-xs text-stone-500 uppercase tracking-wider px-4 py-2 border-b border-stone-200 bg-stone-50">
        <div className="col-span-4">Item</div>
        <div className="col-span-2">Category</div>
        <div className="col-span-1 text-center">Qty</div>
        <div className="col-span-2">Confidence</div>
        <div className="col-span-1">Expires</div>
        <div className="col-span-1 text-center">Khalil</div>
        <div className="col-span-1 text-right">Actions</div>
      </div>
      <div className="divide-y divide-stone-100">
        {filtered.map((r,i)=> (
          <div key={r.item+i} className={`grid grid-cols-12 gap-2 items-center px-4 py-2 text-sm ${r._out?"opacity-40 line-through":""}`}>
            <div className="col-span-4 font-medium">{r.item}</div>
            <div className="col-span-2 text-stone-500 text-xs">{r.category}</div>
            <div className="col-span-1 text-center mono text-xs">{r.qty}</div>
            <div className="col-span-2"><Bar pct={r._conf}/><div className="mono text-[10px] text-stone-500 mt-0.5">{r._conf}%</div></div>
            <div className="col-span-1 text-xs">
              {r._dExp===null ? <span className="text-stone-400">—</span>
                : r._dExp <= 0 ? <span className="text-red-700 font-medium">overdue</span>
                : r._dExp <= 5 ? <span className="text-amber-700 font-medium">{r._dExp}d</span>
                : <span className="text-stone-500">{r._dExp}d</span>}
            </div>
            <div className="col-span-1 text-center">
              {r._flag==="son_allergen" ? <Chip tone="danger">⚠️</Chip>
                : r._flag==="check" ? <Chip tone="warn">?</Chip>
                : <Chip tone="ok">✓</Chip>}
            </div>
            <div className="col-span-1 text-right">
              <button onClick={()=>toggleOutOfStock(r.item)} className="text-[11px] text-stone-500 hover:text-red-700 underline">
                {r._out ? "restore" : "mark out"}
              </button>
            </div>
          </div>
        ))}
        {!filtered.length && <div className="px-4 py-6 text-center text-sm text-stone-500">No items match.</div>}
      </div>
    </div>
  </>;
}

// ===== Recipes view =====
function RecipesView({pantry, outOfStock, cooked, addCooked, eaterFilter, setEaterFilter}){
  const [q, setQ] = useState("");
  const [source, setSource] = useState("all");
  const [sortBy, setSortBy] = useState("makeable");
  const [minMakeable, setMinMakeable] = useState(0);
  const [expanded, setExpanded] = useState(null);

  const matchSet = useMemo(()=> pantryMatchSet(pantry, outOfStock), [pantry, outOfStock]);
  const decorated = useMemo(()=> RECIPES.map(r=>{
    const m = makeability(r, matchSet);
    const f = flagsForRecipe(r);
    const aud = r.audience || audienceFromFlags(f);
    return {...r, _make:m, _flags:f, _audience:aud};
  }), [matchSet]);

  const sources = [...new Set(RECIPES.map(r=>r._source_file))].sort();
  const cookedSet = useMemo(()=> new Set(cooked.map(c=>c.meal_id)), [cooked]);

  const filtered = decorated.filter(r=>{
    if (q && !lc(r.name).includes(lc(q))) return false;
    if (source!=="all" && r._source_file !== source) return false;
    if (r._make.pct < minMakeable) return false;
    if (eaterFilter === "khalil" && r._flags.khalil === "blocked") return false;
    if (eaterFilter === "max" && r._flags.max === "blocked") return false;
    if (eaterFilter === "emily" && r._flags.emily === "blocked") return false;
    if (eaterFilter === "whole" && r._audience !== "whole-household") return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if (sortBy==="makeable") return b._make.pct - a._make.pct;
    if (sortBy==="protein") return (b.protein_per_serving_g||0) - (a.protein_per_serving_g||0);
    if (sortBy==="time") return (a.prep_time_mins||0)+(a.cook_time_mins||0) - ((b.prep_time_mins||0)+(b.cook_time_mins||0));
    if (sortBy==="name") return a.name.localeCompare(b.name);
    return 0;
  });

  return <>
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      <Stat label="In library" value={RECIPES.length}/>
      <Stat label="Whole-household safe" value={decorated.filter(r=>r._audience==="whole-household").length} tone="ok" />
      <Stat label="Khalil can eat" value={decorated.filter(r=>r._flags.khalil!=="blocked").length} tone="ok" />
      <Stat label="Cooked this session" value={cooked.length} tone="info"/>
    </div>
    <div className="flex flex-wrap gap-2 mb-3 items-center">
      <input className="border border-stone-300 rounded-lg px-3 py-1.5 text-sm flex-1 min-w-[160px]" placeholder="Search recipes…" value={q} onChange={e=>setQ(e.target.value)} />
      <select className="border border-stone-300 rounded-lg px-2 py-1.5 text-sm" value={source} onChange={e=>setSource(e.target.value)}>
        <option value="all">All sources</option>
        {sources.map(s=> <option key={s} value={s}>{s}</option>)}
      </select>
      <select className="border border-stone-300 rounded-lg px-2 py-1.5 text-sm" value={sortBy} onChange={e=>setSortBy(e.target.value)}>
        <option value="makeable">Sort: makeability</option>
        <option value="protein">Sort: protein/serving</option>
        <option value="time">Sort: total time</option>
        <option value="name">Sort: name</option>
      </select>
      <select className="border border-stone-300 rounded-lg px-2 py-1.5 text-sm" value={eaterFilter} onChange={e=>setEaterFilter(e.target.value)}>
        <option value="all">All eaters</option>
        <option value="khalil">Khalil-safe only</option>
        <option value="whole">Whole-household only</option>
        <option value="max">Max-safe (pescatarian)</option>
        <option value="emily">Emily-safe (no pork)</option>
      </select>
      <label className="text-xs text-stone-600 flex items-center gap-1">
        Min makeable {minMakeable}%
        <input type="range" min="0" max="100" step="10" value={minMakeable} onChange={e=>setMinMakeable(+e.target.value)} className="w-24"/>
      </label>
    </div>

    <div className="space-y-2">
      {filtered.map(r=>{
        const total = (r.prep_time_mins||0)+(r.cook_time_mins||0);
        const open = expanded === r.id;
        const wasCooked = cookedSet.has(r.id);
        // Format source: "East p.115" for books, just file slug for web/instagram
        const sourceLabel = r.source && r.source.type === "book"
          ? `${r.source.title || "Book"}${r.source.page ? ` p.${r.source.page}` : ""}`
          : r._source_file;
        return <div key={r.id} className="card">
          <div role="button" tabIndex={0}
               onClick={(e)=>{ if(e.target.closest('button,a')) return; setExpanded(open?null:r.id); }}
               onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setExpanded(open?null:r.id);} }}
               className="px-4 py-3 flex items-center gap-3 flex-wrap cursor-pointer select-none">
            <div className="font-medium flex-1 min-w-[200px] flex items-start justify-between gap-2">
              <span>{r.name}
                {wasCooked && <span className="ml-2 text-xs text-emerald-700">✓ cooked</span>}
              </span>
              <span className="text-xs text-stone-400 shrink-0 sm:hidden">{open?'▲':'▼'}</span>
            </div>
            <Chip tone="neutral" title="Source">{sourceLabel}</Chip>
            <AudienceTag a={r._audience}/>
            {(r.protein_per_serving_g!=null) && <Chip tone={r.protein_per_serving_g>=45?"ok":r.protein_per_serving_g>=20?"info":"neutral"}>{r.protein_per_serving_g}g protein</Chip>}
            {total>0 && <Chip tone={total<=20?"ok":total<=40?"neutral":"warn"}>{total}m total</Chip>}
            <div className="flex items-center gap-2 min-w-[120px]">
              <div className="flex-1"><Bar pct={r._make.pct}/></div>
              <span className="mono text-xs">{r._make.pct}%</span>
            </div>
            <span className="text-xs text-stone-400 hidden sm:inline">{open?'▲':'▼'}</span>
            <button onClick={(e)=>{ e.preventDefault(); e.stopPropagation(); addCooked(r); }} className="pill" data-active={wasCooked}>

function PlannerView({pantry, outOfStock, cooked}){
  const matchSet = useMemo(()=> pantryMatchSet(pantry, outOfStock), [pantry, outOfStock]);
  const decorated = useMemo(()=> RECIPES.map(r=>{
    const m = makeability(r, matchSet);
    const f = flagsForRecipe(r);
    return {...r, _make:m, _flags:f, _audience: r.audience || audienceFromFlags(f)};
  }), [matchSet]);

  const wholeHousehold = decorated.filter(r=>r._audience==="whole-household").sort((a,b)=>b._make.pct-a._make.pct).slice(0,6);
  const highProteinAdult = decorated.filter(r=> r._flags.max!=="blocked" && (r.protein_per_serving_g||0)>=30).sort((a,b)=>(b.protein_per_serving_g||0)-(a.protein_per_serving_g||0)).slice(0,6);

  const usesExpiring = decorated.filter(r=>{

  const leverage = useMemo(()=> leverageScore(decorated, matchSet, 12), [decorated, matchSet]);

      <RecipeMicroList items={wholeHousehold}/>

    <Section title="High-protein options for Max (≥30g)" tone="info" subtitle="Pescatarian-safe, higher-protein dishes for training days" collapsible>
      <RecipeMicroList items={highProteinAdult}/>
    </Section>
    <Section title="Quick wins ≤25 min" tone="accent" subtitle="At least 50% in-pantry and short total time" collapsible>
      <RecipeMicroList items={quickMakeable}/>
    </Section>
    <Section title="Unlock the most recipes" tone="info" subtitle="Adding one of these flips the most blocked recipes to ≥70% makeable. Click any tile to see which recipes." collapsible>
      <LeverageTileGrid items={leverage}/>

    {cooked.length > 0 && <Section title={`Cooked log · ${cooked.length}`} tone="neutral" subtitle="Saved to local storage on this device" collapsible defaultOpen={false}>
      <ul className="text-sm space-y-1">

          <span>{c.name}</span>

// ===== Orders view: reporting & visualisation over archived Tesco orders =====
// Lightweight bar chart — pure SVG, no external chart lib
function SpendChart({orders}){
  if (!orders.length) return null;
  const max = Math.max(...orders.map(o=>o.total_paid_gbp||0), 1);
  const w = 600, h = 160, pad = 30, barGap = 4;
  const bw = Math.max(8, (w - pad*2 - barGap*(orders.length-1)) / orders.length);
  return <div className="overflow-x-auto">
    <svg viewBox={`0 0 ${w} ${h+30}`} className="w-full" style={{minWidth: orders.length*14}}>
      {orders.map((o,i)=>{
        const v = o.total_paid_gbp||0;
        const bh = (v/max) * (h - pad);
        const x = pad + i*(bw+barGap);
        const y = h - bh;
        return <g key={i}>
          <rect x={x} y={y} width={bw} height={bh} fill="#0f766e" opacity="0.85">
            <title>{`${o.delivery_date}: £${v.toFixed(2)} · ${o.purchased_count||o.item_count||0} items`}</title>
          </rect>
          <text x={x+bw/2} y={y-3} textAnchor="middle" fontSize="9" fill="#44403c">£{Math.round(v)}</text>
          <text x={x+bw/2} y={h+12} textAnchor="middle" fontSize="8" fill="#a8a29e">{(o.delivery_date||"").slice(5)}</text>
        </g>;
      })}
      <line x1={pad} y1={h} x2={w-pad} y2={h} stroke="#d6d3d1" strokeWidth="1"/>
    </svg>
  </div>;
}

function KV({label, value, sub}){

  </div>;
}

// Loose Khalil-allergen tagger for receipt items
function ordersKhalilFlag(name){
  const n = (name||"").toLowerCase();
  if (/(\b|^)(flour|wheat|breadcrumb|panko|seitan|brioche|sourdough|ciabatt|baguette|pitta|naan|roti|chapati|wholemeal)\b/.test(n)) return "wheat";
  if (/\b(pasta|spaghetti|fusilli|penne|fettuccine|orzo|udon|ramen|soba)\b/.test(n) && !n.includes("gluten free") && !n.includes("gluten-free") && !n.includes("free from")) return "wheat";
  if (/\b(bread|buns?)\b/.test(n) && !n.includes("gluten free") && !n.includes("gluten-free") && !n.includes("free from")) return "wheat";
  if (/\b(milk|cheese|cheddar|feta|paneer|cream|butter|yoghurt|yogurt|ricotta|mozzarella|parmesan|boursin)\b/.test(n)
      && !/(coconut milk|almond milk|oat milk|soya milk|peanut butter)/.test(n)
      && !/(butterhead|butternut)/.test(n)) return "dairy";
  if (/\beggs?\b/.test(n)) return "eggs";
  if (/\b(beef|veal)\b/.test(n)) return "beef";
  if (/\b(walnut|pecan|almond|cashew|pistachio|hazelnut|pine nut)s?\b/.test(n)) return "tree nut";
  if (/\b(lentil|chickpea|black bean|kidney bean|cannellini|edamame|broad bean|baked bean|borlotti|haricot|butter bean)\b/.test(n)) return "legume";
  if (/\bavocado\b/.test(n)) return "avocado";
  return null;
}

function OrdersView(){
  const orders = (RAW.tesco_orders || []);
  const [expanded, setExpanded] = useState(null);

  const stats = useMemo(()=>{
    if (!orders.length) return null;
    const totalSpend = orders.reduce((s,o)=> s + (o.total_paid_gbp||0), 0);
    const totalItems = orders.reduce((s,o)=> s + (o.purchased_count||o.item_count||0), 0);
    const totalSaved = orders.reduce((s,o)=> s + (o.total_saved_gbp||0), 0);
    const totalSubs = orders.reduce((s,o)=> s + (o.substitution_count||0), 0);
    const totalUnavail = orders.reduce((s,o)=> s + (o.unavailable_count||0), 0);

    // Spend by section
    const bySection = new Map();
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "unavailable") continue;
        const sec = it.section || "uncategorised";
        bySection.set(sec, (bySection.get(sec)||0) + (it.total_price_gbp||0));
      }
    }
    const sectionTotals = [...bySection.entries()].sort((a,b)=> b[1]-a[1]);

    // Repeat-purchase patterns
    const itemMap = new Map();
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "unavailable") continue;
        const k = (it.name||"").toLowerCase().trim();
        if (!itemMap.has(k)) itemMap.set(k, {name: it.name, count:0, spend:0, lastDate: o.delivery_date, allergen: ordersKhalilFlag(it.name)});
        const e = itemMap.get(k);
        e.count += 1;
        e.spend += (it.total_price_gbp||0);
        if ((o.delivery_date||"") > (e.lastDate||"")) e.lastDate = o.delivery_date;
      }
    }
    const trends = [...itemMap.values()].sort((a,b)=> b.count - a.count || b.spend - a.spend);

    // Khalil allergen exposure across history
    const khalilExposure = trends.filter(t => t.allergen);

    // Substitution log
    const subs = [];
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "substituted") subs.push({...it, delivery_date: o.delivery_date, order_number: o.order_number});
      }
    }

    // Unavailable log
    const unavails = [];
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "unavailable") unavails.push({...it, delivery_date: o.delivery_date, order_number: o.order_number});
      }
    }

    // Parse-quality warnings
    const warnings = orders.filter(o => o.parse_quality && o.parse_quality !== "ok");

    return {
      totalSpend, totalItems, totalSaved, totalSubs, totalUnavail,
      sectionTotals, trends, khalilExposure, subs, unavails, warnings,
      avgSpend: totalSpend / orders.length,
    };
  }, [orders]);

  if (!orders.length) {
    return <div className="card p-6 text-sm text-stone-500 text-center">
      No order history embedded. Tesco orders come from the project's <span className="mono">tesco-orders.json</span> file.
    </div>;
  }

  const maxSection = Math.max(...stats.sectionTotals.map(([,v])=>v), 1);

  return <div className="space-y-5">
    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
      <KV label="Orders" value={orders.length} sub={`from ${orders[0].delivery_date} to ${orders[orders.length-1].delivery_date}`}/>
      <KV label="Total spend" value={`£${stats.totalSpend.toFixed(0)}`}/>
      <KV label="Avg order" value={`£${stats.avgSpend.toFixed(0)}`}/>
      <KV label="Items bought" value={stats.totalItems}/>
      <KV label="Savings" value={`£${stats.totalSaved.toFixed(0)}`}/>
      <KV label="Substitutions" value={stats.totalSubs}/>
      <KV label="Unavailable" value={stats.totalUnavail}/>
    </div>

    <Section title="Spend over time" subtitle="Order totals, oldest → newest" tone="info">
      <SpendChart orders={orders}/>
    </Section>

    <Section title={`Order history · ${orders.length} orders`} subtitle="Click any order to see line items, substitutions, and unavailable items">
      <div className="space-y-1.5">
        {orders.slice().reverse().map(o => {
          const open = expanded === o.order_number;
          const allergenLines = (o.items||[]).filter(it => it.status !== "unavailable" && ordersKhalilFlag(it.name)).length;
          return <div key={o.order_number} className="card">
            <div role="button" tabIndex={0}
                 onClick={(e)=>{ if(e.target.closest('button,a')) return; setExpanded(open?null:o.order_number); }}
                 onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setExpanded(open?null:o.order_number);} }}
                 className="px-3 py-2 flex items-center gap-2 flex-wrap text-sm cursor-pointer select-none">
              <span className="mono text-xs text-stone-500 w-20 shrink-0">{o.delivery_date}</span>
              <Chip>#{o.order_number}</Chip>
              {o.email_type && <Chip tone="neutral">{o.email_type}</Chip>}
              <span className="flex-1 min-w-[20px]"/>
              <Chip>{o.purchased_count||o.item_count||0} items</Chip>
              {o.substitution_count>0 && <Chip tone="warn">{o.substitution_count} sub</Chip>}
              {o.unavailable_count>0 && <Chip tone="danger">{o.unavailable_count} unavail</Chip>}
              {allergenLines>0 && <Chip tone="warn">⚠️ {allergenLines}</Chip>}
              <Chip tone="accent">£{(o.total_paid_gbp||0).toFixed(2)}</Chip>
              <span className="text-xs text-stone-400">{open?'▲':'▼'}</span>
            </div>
            {open && <div className="px-3 pb-3 text-xs border-t border-stone-100 pt-2">
              {o.parse_warning && <div className="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded px-2 py-1 mb-2">⚠️ {o.parse_warning}</div>}
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead><tr className="text-stone-500"><th className="text-left py-1 w-8">Qty</th><th className="text-left">Item</th><th className="text-left w-24">Section</th><th className="text-right w-14">£/each</th><th className="text-right w-14">Total</th><th className="text-center w-20">Status</th><th className="text-center w-16">Khalil</th></tr></thead>
                  <tbody>{(o.items||[]).map((it,i)=> {

function normaliseProductName(name){
  // Strip dagger/leading marks, then try to match a product family.
  let n = (name||"").toLowerCase();
  n = n.replace(/^\s*[†‡*\u2020\u00a0]+\s*/, "");
  n = n.replace(/\s+/g, " ").trim();
  for (const [family, pattern] of PRODUCT_FAMILIES) {
    if (pattern instanceof RegExp) {
      if (pattern.test(n)) return family;
    } else if (n.includes(pattern)) {
      return family;
    }
  }
  // Fallback: strip pack sizes and use what's left
  let cleaned = n;
  cleaned = cleaned.replace(/\b\d+\s*(g|kg|ml|l|cl|pack|x|pk|each)\b.*$/i, "");
  cleaned = cleaned.replace(/\b\d+\s*x\s*\d+.*$/i, "");
  return cleaned.replace(/\s+/g, " ").trim();
}

function findPantryMatch(productName){
  const n = (productName||"").toLowerCase();
  for (const [pantryItem, kws] of PANTRY_KEYWORDS) {
    for (const kw of kws) {
      if (n.includes(kw)) return pantryItem;
    }
  }
  return null;
}

// Khalil-allergen detection on a product name (loose, only for tagging the gap)
function khalilAllergenFlag(name){
  const n = (name||"").toLowerCase();
  // wheat-bearing products
  if (/(\b|^)(flour|wheat|breadcrumb|panko|seitan|brioche|sourdough|ciabatt|baguette|pitta|naan|roti|chapati|wholemeal)\b/.test(n)) return "wheat";
  if (/\b(pasta|spaghetti|fusilli|penne|fettuccine|orzo|udon|ramen|soba)\b/.test(n) && !n.includes("gluten free") && !n.includes("gluten-free") && !n.includes("free from")) return "wheat";
  if (/\b(bread|bun)s?\b/.test(n) && !n.includes("gluten free") && !n.includes("gluten-free") && !n.includes("free from")) return "wheat";
  // dairy
  if (/\b(milk|cheese|cheddar|feta|paneer|cream|butter|yoghurt|yogurt|ricotta|mozzarella|parmesan|boursin)\b/.test(n)
      && !/(coconut milk|almond milk|oat milk|soya milk|soy milk|plant milk|peanut butter|coconut butter)/.test(n)
      && !/(butterhead|butternut)/.test(n)) return "dairy";
  // eggs
  if (/\beggs?\b/.test(n)) return "eggs";
  // beef
  if (/\b(beef|veal)\b/.test(n)) return "beef";
  // tree nuts
  if (/\b(walnut|pecan|almond|cashew|pistachio|hazelnut|pine nut|brazil nut|macadamia)s?\b/.test(n)) return "tree nut";
  return null;
}

// Household-rules: should this product be excluded from "restock" suggestions?
function neverRestockReason(name){
  const n = (name||"").toLowerCase();
  for (const r of (HOUSEHOLD_RULES.never_restock||[])) {
    if (n.includes(r.pattern)) return r.reason;
  }
  return null;
}

function GapsView({pantry, outOfStock}){
  const [minOrders, setMinOrders] = useState(3);
  const [filter, setFilter] = useState("gap"); // gap | all | restocked | excluded
  const [leverageLimit, setLeverageLimit] = useState(15);

  // Leverage: ingredients that unlock the most blocked recipes
  const leverage = useMemo(()=>{
    const matchSet = pantryMatchSet(pantry, outOfStock);
    const decorated = RECIPES.map(r=>{
      const f = flagsForRecipe(r);
      return {...r, _flags:f, _audience: r.audience || audienceFromFlags(f)};
    });
    // Filter to household-safe recipes by default so we don't suggest adding ingredients to unlock Khalil-blocked meals
    const eligible = decorated.filter(r => r._flags.khalil !== "blocked");
    return leverageScore(eligible, matchSet, leverageLimit);
  }, [pantry, outOfStock, leverageLimit]);

  const analysis = useMemo(()=>{
    if (!TESCO_ORDERS.length) return null;
    const latestIdx = TESCO_ORDERS.length - 1;
    const latest = TESCO_ORDERS[latestIdx];

    // Build family map across orders
    const fam = new Map(); // key -> { example, orderIdxs:Set, lastSeenDate, exampleCount }
    TESCO_ORDERS.forEach((o, i) => {
      (o.items||[]).forEach(it => {
        if (it.status === "unavailable") return;
        const k = normaliseProductName(it.name);
        if (!k) return;
        if (!fam.has(k)) fam.set(k, { example: it.name, orderIdxs: new Set(), lastSeenDate: o.delivery_date, counts: new Map() });
        const entry = fam.get(k);
        entry.orderIdxs.add(i);
        if ((o.delivery_date||"") > (entry.lastSeenDate||"")) entry.lastSeenDate = o.delivery_date;
        entry.counts.set(it.name, (entry.counts.get(it.name)||0) + 1);
      });
    });
    // Pick most common original name as the canonical example
    for (const v of fam.values()) {
      let best = null, bestN = -1;
      for (const [n, c] of v.counts) if (c > bestN) { best = n; bestN = c; }
      v.example = best;
      delete v.counts;
    }

    const pantryKeys = new Set(pantry.map(p => p.item.toLowerCase()));

    const regulars = [];
    for (const [key, v] of fam) {
      const count = v.orderIdxs.size;
      if (count < minOrders) continue;
      const inLatest = v.orderIdxs.has(latestIdx);
      // Match to pantry — first by direct pantry-key substring, then by PANTRY_KEYWORDS map
      let pantryItem = null;
      for (const pk of pantryKeys) {
        if (key.includes(pk) || (v.example||"").toLowerCase().includes(pk)) { pantryItem = pk; break; }
      }
      if (!pantryItem) pantryItem = findPantryMatch(v.example);
      const allergen = khalilAllergenFlag(v.example);
      const excluded = neverRestockReason(v.example);
      regulars.push({
        key,
        example: v.example,
        count,
        inLatest,
        lastSeenDate: v.lastSeenDate,
        pantryItem,
        allergen,
        excludedReason: excluded,
      });
    }
    regulars.sort((a,b)=> b.count - a.count || (a.lastSeenDate||"").localeCompare(b.lastSeenDate||""));

    const gaps = regulars.filter(r => !r.pantryItem && !r.inLatest && !r.excludedReason);
    const restocked = regulars.filter(r => r.inLatest || r.pantryItem);
    const excluded = regulars.filter(r => r.excludedReason);

    return {
      latest,
      latestIdx,
      orderCount: TESCO_ORDERS.length,
      regulars,
      gaps,
      restocked,
      excluded,
    };
  }, [pantry, minOrders]);

  if (!analysis) {
    return <div className="card p-4 text-sm text-stone-500">
      No Tesco order history embedded. Add data to <span className="mono">RAW.tesco_orders</span> in the raw-data block.
    </div>;
  }

  const visible = filter === "gap" ? analysis.gaps
                : filter === "restocked" ? analysis.restocked
                : filter === "excluded" ? analysis.excluded
                : analysis.regulars;

  return <div className="space-y-5">
    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
      <Stat label="Orders tracked" value={analysis.orderCount}/>
      <Stat label="Latest delivery" value={analysis.latest.delivery_date} sub={`#${analysis.latest.order_number}`}/>
      <Stat label={`Regulars (≥${minOrders})`} value={analysis.regulars.length}/>
      <Stat label="Real gaps" value={analysis.gaps.length} tone={analysis.gaps.length>0?"warn":"ok"}
            sub="Not in latest order, not in pantry"/>
      <Stat label="Excluded by rules" value={analysis.excluded.length} tone="info"
            sub={`${(HOUSEHOLD_RULES.never_restock||[]).length} household rule(s)`}/>
    </div>

    <Section title="What this view does" tone="info" collapsible>
      <p className="text-sm text-stone-700 leading-relaxed">
        Compares <strong>regularly-purchased Tesco items</strong> (appearing in {minOrders}+ of {analysis.orderCount} orders) against the current pantry snapshot.
        Items that appear repeatedly across orders but are <strong>missing from both the latest delivery and the current pantry</strong> are likely real gaps —
        usually fresh produce or fast-moving items that decayed off the pantry list.
        Items matching <strong>household never-restock rules</strong> (e.g. dairy milk — no one drinks it) are filtered out separately.
      </p>
      <div className="flex flex-wrap items-center gap-3 mt-3 mb-4">
        <label className="text-sm flex items-center gap-2">
          <span className="text-stone-500">Min orders:</span>
          <select value={minOrders} onChange={e=>setMinOrders(parseInt(e.target.value))} className="border border-stone-300 rounded px-2 py-1 text-sm">
            <option value={2}>2 of {analysis.orderCount}</option>
            <option value={3}>3 of {analysis.orderCount}</option>
            <option value={4}>4 of {analysis.orderCount}</option>
            <option value={5}>5 of {analysis.orderCount}</option>
          </select>
        </label>
      </div>

      <div className="border-t border-stone-200 pt-4">
        <div className="flex items-baseline justify-between mb-3 flex-wrap gap-2">
          <h4 className="text-base font-semibold">
            {filter === "gap" ? "Likely real gaps — consider adding to next basket"
            : filter === "restocked" ? "Restocked or already in pantry — no action needed"
            : filter === "excluded" ? "Excluded by household rules"
            : "All regulars"}
          </h4>
          <span className="text-xs text-stone-500">{visible.length} item{visible.length===1?"":"s"}</span>
        </div>
        <div className="flex flex-wrap gap-1 mb-3">
          <button onClick={()=>setFilter("gap")} className="pill" data-active={filter==="gap"}>Real gaps · {analysis.gaps.length}</button>
          <button onClick={()=>setFilter("restocked")} className="pill" data-active={filter==="restocked"}>Restocked / in pantry · {analysis.restocked.length}</button>
          <button onClick={()=>setFilter("excluded")} className="pill" data-active={filter==="excluded"}>Excluded · {analysis.excluded.length}</button>
          <button onClick={()=>setFilter("all")} className="pill" data-active={filter==="all"}>All regulars · {analysis.regulars.length}</button>
        </div>

        {(HOUSEHOLD_RULES.never_restock||[]).length > 0 && filter === "excluded" && <div className="mb-3 p-3 rounded-lg border border-blue-200 bg-blue-50/30">
          <div className="text-xs uppercase tracking-wider text-stone-500 mb-2">Household never-restock rules</div>
          <div className="space-y-1.5 text-sm">
            {HOUSEHOLD_RULES.never_restock.map((r,i)=> <div key={i} className="flex items-baseline gap-2">
              <span className="mono text-xs bg-stone-100 px-1.5 py-0.5 rounded">{r.pattern}</span>
              <span className="text-stone-600">{r.reason}</span>
            </div>)}
          </div>
        </div>}

        {visible.length === 0 ? <div className="text-sm text-stone-500">Nothing here at this threshold.</div>
        : <div className="card overflow-hidden">
          <div className="px-3 py-2 border-b border-stone-200 bg-stone-50 text-[11px] uppercase tracking-wider text-stone-500 grid grid-cols-12 gap-2">
            <div className="col-span-1 text-center">×</div>
            <div className="col-span-6">Item</div>
            <div className="col-span-2">Last seen</div>
            <div className="col-span-3 text-right">Status</div>
          </div>
          <div className="divide-y divide-stone-100">
            {visible.map((r,i)=> <div key={i} className="grid grid-cols-12 gap-2 items-center px-3 py-2 text-sm">
              <div className="col-span-1 text-center mono text-xs">{r.count}</div>
              <div className="col-span-6">
                <div className="leading-tight">{r.example}</div>
                <div className="mt-0.5 flex flex-wrap gap-1">
                  {r.allergen && <Chip tone="warn">Khalil: {r.allergen}</Chip>}
                  {r.pantryItem && <Chip tone="ok">pantry: {r.pantryItem}</Chip>}
                  {r.excludedReason && <Chip tone="info">excluded</Chip>}
                </div>
              </div>
              <div className="col-span-2 mono text-xs text-stone-500">{r.lastSeenDate||"—"}</div>
              <div className="col-span-3 text-right">
                {r.inLatest ? <Chip tone="ok">✓ in latest order</Chip>
                 : r.pantryItem ? <Chip tone="ok">in pantry</Chip>
                 : r.excludedReason ? <span className="text-xs text-stone-500">{r.excludedReason}</span>
                 : <Chip tone="warn">gap</Chip>}
              </div>
            </div>)}
          </div>
        </div>}
      </div>
    </Section>

    <Section
      title="Ingredients that unlock the most recipes"
      subtitle="Ranked by how many household-safe recipes use each ingredient (Khalil-blocked recipes are excluded). Adding one to the pantry would boost the makeability of every recipe listed below it."
      tone="accent"
      collapsible
    >
      <div className="flex flex-wrap items-center gap-3 mb-3">
        <label className="text-sm flex items-center gap-2">
          <span className="text-stone-500">Show top:</span>
          <select value={leverageLimit} onChange={e=>setLeverageLimit(parseInt(e.target.value))} className="border border-stone-300 rounded px-2 py-1 text-sm">
            <option value={10}>10</option>
            <option value={15}>15</option>
            <option value={25}>25</option>
            <option value={50}>50</option>
            <option value={9999}>All</option>
          </select>
        </label>
        <span className="text-xs text-stone-500">{leverage.length} candidate{leverage.length===1?"":"s"} shown · click any row to see the recipes it affects.</span>
      </div>
      {leverage.length === 0
        ? <div className="text-sm text-stone-500">No leverage opportunities — every recipe is already ≥70% makeable, or all remaining recipes are blocked by Khalil allergens.</div>
        : <LeverageTileGrid items={leverage}/>
      }
    </Section>

    <Section title={`Order history · ${analysis.orderCount} Tesco orders`} subtitle="From embedded data" tone="neutral" collapsible defaultOpen={false}>
      <div className="overflow-x-auto">
        <table className="w-full text-xs">
          <thead><tr className="text-stone-500">
            <th className="text-left py-1.5">Delivery date</th>
            <th className="text-left">Order #</th>
            <th className="text-right">Items</th>
            <th className="text-right">Total</th>
          </tr></thead>
          <tbody>{TESCO_ORDERS.slice().reverse().map((o,i)=> <tr key={i} className="border-t border-stone-100">
            <td className="py-1 mono">{o.delivery_date}</td>
            <td className="mono text-stone-500">{o.order_number}</td>
            <td className="text-right mono">{(o.items||[]).filter(it=>it.status!=="unavailable").length}</td>
            <td className="text-right mono">{o.total_paid_gbp!=null?`£${o.total_paid_gbp.toFixed(2)}`:"—"}</td>
          </tr>)}</tbody>
        </table>
      </div>
    </Section>
  </div>;
}

// ===== Audit view =====
function AuditView({pantry}){
  const decorated = useMemo(()=> RECIPES.map(r=>{
    const f = flagsForRecipe(r);
    return {...r, _flags:f, _audience: r.audience || audienceFromFlags(f)};
  }), []);

  const byAudience = {
    "whole-household": decorated.filter(r=>r._audience==="whole-household"),
    "check": decorated.filter(r=>r._audience==="check"),
    "adults-only": decorated.filter(r=>r._audience==="adults-only"),
  };
  // Now most files have audience tags (we fixed them)
  const taggedRecipes = RECIPES.filter(r => r.audience).length;
  const untagged = RECIPES.length - taggedRecipes;
  const hasMakeablePct = RECIPES.filter(r=> r.makeable_pct !== null && r.makeable_pct !== undefined).length;
  const pantryWithFlags = pantry.filter(p=>p.allergen_flag).length;
  const pantryAllergens = pantry.filter(p => p.allergen_flag && p.allergen_flag !== "household_safe");

  const sources = [...new Set(RECIPES.map(r=>r._source_file))].sort();
  const bySource = sources.map(s => {
    const list = decorated.filter(r=>r._source_file===s);
    return {
      source: s,
      total: list.length,
      whole: list.filter(r=>r._audience==="whole-household").length,
      check: list.filter(r=>r._audience==="check").length,
      adults: list.filter(r=>r._audience==="adults-only").length,
    };
  });

  return <div className="space-y-5">
    <Section title="Workflow integrity" subtitle="Now that you've imported the fixed JSON files" tone="ok">
      <div className="grid sm:grid-cols-2 gap-3 text-sm">
        <GapCard label="Recipes with audience tag" value={taggedRecipes} of={RECIPES.length} severity={untagged > 0 ? "medium":"low"}
                 note={untagged > 0 ? `${untagged} recipes still untagged — re-import the patched files in /project-updates/.` : "All recipes now carry audience + eaters tags."}/>
        <GapCard label="Pantry items with allergen_flag" value={pantryWithFlags} of={pantry.length} severity={pantryWithFlags < pantry.length ? "medium":"low"}
                 note={pantryWithFlags < pantry.length ? "Some pantry items missing the allergen_flag field — re-import the patched current_pantry.json." : "All pantry items tagged."}/>
        <GapCard label="makeable_pct populated" value={hasMakeablePct} of={RECIPES.length} severity={hasMakeablePct < RECIPES.length/2 ? "low":"low"}
                 note="Computed live on every render in this dashboard. Not stored persistently in the JSON — that's fine since pantry changes invalidate it."/>
        <GapCard label="Derived subsets" value="Generated" of="2 files" severity="low"
                 note="khalil-safe-meals.json (38) and max-pescatarian.json (93) regenerated and shipped in /project-updates/."/>
        <GapCard label="Manifest counts" value="Corrected" of="3 fixes" severity="low"
                 note="east-curries (8), east-rice-tofu-pulses (18), east-condiments-sweet (6) now report accurate counts."/>
        <GapCard label="Order archive" value="See Orders tab" of="—" severity="low"
                 note="Spend trends, item frequency, allergen exposure, substitutions and unavailable items — all from the embedded Tesco order archive."/>
      </div>
    </Section>

    <Section title="Audience breakdown across library">
      <div className="grid sm:grid-cols-3 gap-3 mb-3">
        <Stat label="Whole-household safe" value={byAudience["whole-household"].length} tone="ok" sub={`${Math.round(100*byAudience["whole-household"].length/RECIPES.length)}% of library`}/>
        <Stat label="Needs check" value={byAudience["check"].length} tone="warn"/>
        <Stat label="Adults only" value={byAudience["adults-only"].length} tone="info" sub={`${Math.round(100*byAudience["adults-only"].length/RECIPES.length)}%`}/>
      </div>
      <div className="text-xs text-stone-500 mb-2 uppercase tracking-wider">By source file</div>
      <div className="space-y-1">
        {bySource.map(s => <div key={s.source} className="grid grid-cols-12 gap-2 items-center text-sm">
          <div className="col-span-4 font-medium">{s.source}</div>
          <div className="col-span-1 text-right text-stone-500 text-xs">{s.total}</div>
          <div className="col-span-7 flex h-3 rounded overflow-hidden border border-stone-200">
            <div style={{flex:s.whole, background:"#16a34a"}} title={`${s.whole} whole-household`}/>
            <div style={{flex:s.check, background:"#d97706"}} title={`${s.check} check`}/>
            <div style={{flex:s.adults, background:"#2563eb"}} title={`${s.adults} adults-only`}/>
          </div>
        </div>)}
        <div className="flex gap-3 text-[11px] text-stone-500 mt-2">
          <span><span className="inline-block w-2 h-2 mr-1 align-middle" style={{background:"#16a34a"}}/>whole-household</span>
          <span><span className="inline-block w-2 h-2 mr-1 align-middle" style={{background:"#d97706"}}/>check</span>
          <span><span className="inline-block w-2 h-2 mr-1 align-middle" style={{background:"#2563eb"}}/>adults-only</span>
        </div>
      </div>
    </Section>

    <Section title="Khalil allergen audit on pantry" tone="info">
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 text-sm">
        {pantryAllergens.map((p,i)=> <div key={i} className="card px-3 py-2 flex items-center justify-between">
          <span className="font-medium">{p.item}</span>
          {p.allergen_flag==="son_allergen" ? <Chip tone="danger">blocked</Chip> : <Chip tone="warn">check label</Chip>}
        </div>)}
      </div>
    </Section>
  </div>;
}
function GapCard({label, value, of, severity, note}){
  const tone = severity==="high"?"danger":severity==="medium"?"warn":"ok";
  return <div className="card p-3">
    <div className="flex items-start justify-between gap-2 mb-1">
      <div className="font-medium text-sm leading-snug">{label}</div>
      <Chip tone={tone}>{severity}</Chip>
    </div>
    <div className="mono text-xs text-stone-500 mb-1.5">{value}{of!==undefined && of!=="—" ? ` / ${of}`:""}</div>
    <div className="text-xs text-stone-600 leading-snug">{note}</div>
  </div>;
}

// ===== Root =====
function App(){
  const initialState = STORAGE_OK ? loadState() : null;
  const [tab, setTab] = useState(initialState?.tab || "planner");
  const [pantry] = useState(RAW.current_pantry.pantry);
  const [cooked, setCooked] = useState(initialState?.cooked || []);
  const [outOfStock, setOutOfStock] = useState(new Set(initialState?.outOfStock || []));
  const [eaterFilter, setEaterFilter] = useState(initialState?.eaterFilter || "all");
  const [showStorageNote, setShowStorageNote] = useState(STORAGE_OK ? false : true);

  // Persist on changes
  useEffect(()=>{
    if (!STORAGE_OK) return;
    saveState({
      tab, cooked, outOfStock: [...outOfStock], eaterFilter,
      version: 1, savedAt: new Date().toISOString(),
    });
  }, [tab, cooked, outOfStock, eaterFilter]);

  const tabs = [
    ["planner","Planner"],
    ["recipes","Recipes"],
    ["pantry","Pantry"],
    ["tesco","Orders"],
    ["gaps","Gaps"],
    ["audit","Workflow audit"],
  ];

  const addCooked = useCallback((r) => {
    const entry = {
      date: new Date().toISOString().slice(0,10),
      meal_id: r.id,
      source: r._source_file,
      name: r.name,
      audience: r._audience,
      protein_per_serving_g: r.protein_per_serving_g,
    };
    setCooked(prev => {
      // toggle: if already there, remove
      const existing = prev.findIndex(c=>c.meal_id === r.id);
      if (existing >= 0) {
        const copy = prev.slice(); copy.splice(existing, 1); return copy;
      }
      return [...prev, entry];
    });
  }, []);

  const toggleOutOfStock = useCallback((itemName) => {
    setOutOfStock(prev => {
      const next = new Set(prev);
      if (next.has(itemName)) next.delete(itemName); else next.add(itemName);
      return next;
    });
  }, []);

  const exportAll = () => {
    const blob = new Blob([JSON.stringify({
      cooked, outOfStock: [...outOfStock], exported_at: new Date().toISOString()
    }, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`grocery-state-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const clearAll = () => {
    if (confirm("Clear ALL saved data (cooked log, marked-out items)? This cannot be undone.")) {
      setCooked([]); setOutOfStock(new Set());
      try { localStorage.removeItem(LS_KEY); } catch {}
    }
  };

  return <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <header className="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <h1 className="text-3xl font-semibold tracking-tight">Grocery intelligence</h1>
        <p className="text-stone-500 text-sm mt-1">{RECIPES.length} recipes · {pantry.length} pantry items · {pantry.filter(p=>!outOfStock.has(p.item) && daysUntilExpiry(p)!==null && daysUntilExpiry(p)<=5).length} expiring soon · {cooked.length} cooked · {(RAW.tesco_orders||[]).length} orders</p>
      </div>
      <div className="text-xs text-stone-500 mono flex flex-col items-end gap-1">
        <span>snapshot {GENERATED_AT}</span>
        <div className="flex gap-2">
          <button onClick={exportAll} className="pill">Export state</button>
          <button onClick={clearAll} className="pill" style={{color:"#dc2626"}}>Reset</button>
        </div>
      </div>
    </header>

    {showStorageNote && !STORAGE_OK && <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800 mb-4 flex items-center justify-between">
      <span>⚠️ Browser storage is unavailable — your changes won't persist across reloads. This usually means the page is being viewed inside an iframe or sandbox. Download the file and open it directly to enable saving.</span>
      <button onClick={()=>setShowStorageNote(false)} className="text-xs underline">dismiss</button>
    </div>}

    <div className="flex flex-wrap gap-0 mb-5 border-b border-stone-200">
      {tabs.map(([k,l])=>
        <button key={k} data-active={tab===k} onClick={()=>setTab(k)} className="navtab">
          {l}
        </button>
      )}
    </div>

    {tab==="planner" && <PlannerView pantry={pantry} outOfStock={outOfStock} cooked={cooked}/>}
    {tab==="recipes" && <RecipesView pantry={pantry} outOfStock={outOfStock} cooked={cooked} addCooked={addCooked} eaterFilter={eaterFilter} setEaterFilter={setEaterFilter}/>}
    {tab==="pantry" && <PantryView pantry={pantry} outOfStock={outOfStock} toggleOutOfStock={toggleOutOfStock}/>}
    {tab==="tesco" && <OrdersView/>}
    {tab==="gaps" && <GapsView pantry={pantry} outOfStock={outOfStock}/>}
    {tab==="audit" && <AuditView pantry={pantry}/>}

    <footer className="text-xs text-stone-400 mt-8 text-center space-y-1">
      <div>State saved locally in your browser{STORAGE_OK ? " ✓" : " ✗"} · paste cooked log back into a Claude session for canonical pantry updates</div>
      <details className="inline-block">
        <summary className="cursor-pointer hover:text-stone-600 mono">v{SITE_VERSION} · changelog</summary>
        <div className="text-left mt-3 mx-auto max-w-2xl space-y-3 text-stone-600">
          {SITE_CHANGELOG.map((entry,i) => <div key={i} className="text-[11px]">
            <div className="mono text-stone-800 font-medium">{entry.version} <span className="text-stone-400">· {entry.date}</span></div>
            <ul className="list-disc ml-5 mt-1 space-y-0.5">
              {entry.changes.map((c,j) => <li key={j}>{c}</li>)}
            </ul>
          </div>)}
        </div>
      </details>
    </footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

// ===== Orders view: reporting & visualisation over archived Tesco orders =====
// Lightweight bar chart — pure SVG, no external chart lib
function SpendChart({orders}){
  if (!orders.length) return null;
  const max = Math.max(...orders.map(o=>o.total_paid_gbp||0), 1);
  const w = 600, h = 160, pad = 30, barGap = 4;
  const bw = Math.max(8, (w - pad*2 - barGap*(orders.length-1)) / orders.length);
  return <div className="overflow-x-auto">
    <svg viewBox={`0 0 ${w} ${h+30}`} className="w-full" style={{minWidth: orders.length*14}}>
      {orders.map((o,i)=>{
        const v = o.total_paid_gbp||0;
        const bh = (v/max) * (h - pad);
        const x = pad + i*(bw+barGap);
        const y = h - bh;
        return <g key={i}>
          <rect x={x} y={y} width={bw} height={bh} fill="#0f766e" opacity="0.85">
            <title>{`${formatDate(o.delivery_date)}: £${v.toFixed(2)} · ${o.purchased_count||o.item_count||0} items`}</title>
          </rect>
          <text x={x+bw/2} y={y-3} textAnchor="middle" fontSize="9" fill="#44403c">£{Math.round(v)}</text>
          <text x={x+bw/2} y={h+12} textAnchor="middle" fontSize="8" fill="#a8a29e">{(o.delivery_date||"").slice(5)}</text>
        </g>;
      })}
      <line x1={pad} y1={h} x2={w-pad} y2={h} stroke="#d6d3d1" strokeWidth="1"/>
    </svg>
  </div>;
}

function KV({label, value, sub}){
  return <div className="card px-3 py-2.5">
    <div className="text-[11px] text-stone-500 uppercase tracking-wider">{label}</div>
    <div className="font-medium text-base">{value}</div>
    {sub && <div className="text-[11px] text-stone-500 mt-0.5">{sub}</div>}
  </div>;
}

// Loose Khalil-allergen tagger for receipt items
function ordersKhalilFlag(name){
  const n = (name||"").toLowerCase();
  if (/(\b|^)(flour|wheat|breadcrumb|panko|seitan|brioche|sourdough|ciabatt|baguette|pitta|naan|roti|chapati|wholemeal)\b/.test(n)) return "wheat";
  if (/\b(pasta|spaghetti|fusilli|penne|fettuccine|orzo|udon|ramen|soba)\b/.test(n) && !n.includes("gluten free") && !n.includes("gluten-free") && !n.includes("free from")) return "wheat";
  if (/\b(bread|buns?)\b/.test(n) && !n.includes("gluten free") && !n.includes("gluten-free") && !n.includes("free from")) return "wheat";
  if (/\b(milk|cheese|cheddar|feta|paneer|cream|butter|yoghurt|yogurt|ricotta|mozzarella|parmesan|boursin)\b/.test(n)
      && !/(coconut milk|almond milk|oat milk|soya milk|peanut butter)/.test(n)
      && !/(butterhead|butternut)/.test(n)) return "dairy";
  if (/\beggs?\b/.test(n)) return "eggs";
  if (/\b(beef|veal)\b/.test(n)) return "beef";
  if (/\b(walnut|pecan|almond|cashew|pistachio|hazelnut|pine nut)s?\b/.test(n)) return "tree nut";
  if (/\b(lentil|chickpea|black bean|kidney bean|cannellini|edamame|broad bean|baked bean|borlotti|haricot|butter bean)\b/.test(n)) return "legume";
  if (/\bavocado\b/.test(n)) return "avocado";
  return null;
}

function OrdersView(){
  // Receipts now come from Supabase via ReceiptsContext (commit 14.3).
  // The shape matches what RAW.tesco_orders used to provide — items[]
  // with name/section/status/total_price_gbp — so all downstream logic
  // in this component is unchanged. Sort defensively by delivery_date
  // (fetchReceipts already orders by delivery_date.asc, but ContextValue
  // could in principle be reordered).
  const receipts = useContext(ReceiptsContext);
  const orders = useMemo(
    () => (receipts || []).slice().sort((a,b) => (a.delivery_date||"").localeCompare(b.delivery_date||"")),
    [receipts]
  );
  const [expanded, setExpanded] = useState(null);

  const stats = useMemo(()=>{
    if (!orders.length) return null;
    const totalSpend = orders.reduce((s,o)=> s + (o.total_paid_gbp||0), 0);
    const totalItems = orders.reduce((s,o)=> s + (o.purchased_count||o.item_count||0), 0);
    const totalSaved = orders.reduce((s,o)=> s + (o.total_saved_gbp||0), 0);
    const totalSubs = orders.reduce((s,o)=> s + (o.substitution_count||0), 0);
    const totalUnavail = orders.reduce((s,o)=> s + (o.unavailable_count||0), 0);

    // Spend by section
    const bySection = new Map();
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "unavailable") continue;
        const sec = it.section || "uncategorised";
        bySection.set(sec, (bySection.get(sec)||0) + (it.total_price_gbp||0));
      }
    }
    const sectionTotals = [...bySection.entries()].sort((a,b)=> b[1]-a[1]);

    // Repeat-purchase patterns
    const itemMap = new Map();
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "unavailable") continue;
        const k = (it.name||"").toLowerCase().trim();
        if (!itemMap.has(k)) itemMap.set(k, {name: it.name, count:0, spend:0, lastDate: o.delivery_date, allergen: ordersKhalilFlag(it.name)});
        const e = itemMap.get(k);
        e.count += 1;
        e.spend += (it.total_price_gbp||0);
        if ((o.delivery_date||"") > (e.lastDate||"")) e.lastDate = o.delivery_date;
      }
    }
    const trends = [...itemMap.values()].sort((a,b)=> b.count - a.count || b.spend - a.spend);

    // Khalil allergen exposure across history
    const khalilExposure = trends.filter(t => t.allergen);

    // Substitution log
    const subs = [];
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "substituted") subs.push({...it, delivery_date: o.delivery_date, order_number: o.order_number});
      }
    }

    // Unavailable log
    const unavails = [];
    for (const o of orders) {
      for (const it of o.items||[]) {
        if (it.status === "unavailable") unavails.push({...it, delivery_date: o.delivery_date, order_number: o.order_number});
      }
    }

    // Parse-quality warnings
    const warnings = orders.filter(o => o.parse_quality && o.parse_quality !== "ok");

    return {
      totalSpend, totalItems, totalSaved, totalSubs, totalUnavail,
      sectionTotals, trends, khalilExposure, subs, unavails, warnings,
      avgSpend: totalSpend / orders.length,
    };
  }, [orders]);

  if (!orders.length) {
    return <div className="card p-6 text-sm text-stone-500 text-center">
      No order history embedded. Tesco orders come from the project's <span className="mono">tesco-orders.json</span> file.
    </div>;
  }

  const maxSection = Math.max(...stats.sectionTotals.map(([,v])=>v), 1);

  return <div className="space-y-5">
    <div className="text-xs text-stone-600 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2">
      <strong>Read-only history.</strong> {orders.length} Tesco orders parsed from receipt emails between {formatDate(orders[0].delivery_date)} and {formatDate(orders[orders.length-1].delivery_date)}.
      Useful for spotting patterns (what you buy regularly), tracking Khalil's allergen exposure across past deliveries, and reviewing substitutions.
      This tab can't be edited in-app — receipts are added in a Claude session.
    </div>
    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2">
      <KV label="Orders" value={orders.length} sub={`${formatDate(orders[0].delivery_date)} → ${formatDate(orders[orders.length-1].delivery_date)}`}/>
      <KV label="Total spend" value={`£${stats.totalSpend.toFixed(0)}`} sub="Across all orders"/>
      <KV label="Avg order" value={`£${stats.avgSpend.toFixed(0)}`} sub="Per delivery"/>
      <KV label="Items bought" value={stats.totalItems} sub="Excludes unavailable"/>
      <KV label="Savings" value={`£${stats.totalSaved.toFixed(0)}`} sub="Clubcard / deals"/>
      <KV label="Substitutions" value={stats.totalSubs} sub="Items swapped by Tesco"/>
      <KV label="Unavailable" value={stats.totalUnavail} sub="Ordered, not delivered"/>
    </div>

    <Section title="Spend over time" subtitle="Order totals, oldest → newest" tone="info"
      tip="Each bar is one delivery. Useful for spotting big top-up shops vs. regular weekly shops.">
      <SpendChart orders={orders}/>
    </Section>

    <Section title={`Order history · ${orders.length} orders`} subtitle="Click any order to see line items, substitutions, and unavailable items"
      tip="Every parsed Tesco delivery. Each row shows item count, substitutions (sub), unavailable items, Khalil-allergen exposure (⚠️), and total. Click to expand into the full receipt.">
      <div className="space-y-1.5">
        {orders.slice().reverse().map(o => {
          const open = expanded === o.order_number;
          const allergenLines = (o.items||[]).filter(it => it.status !== "unavailable" && ordersKhalilFlag(it.name)).length;
          return <div key={o.order_number} className="card">
            <div role="button" tabIndex={0}
                 onClick={(e)=>{ if(e.target.closest('button,a')) return; setExpanded(open?null:o.order_number); }}
                 onKeyDown={(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setExpanded(open?null:o.order_number);} }}
                 className="px-3 py-2 flex items-center gap-2 flex-wrap text-sm cursor-pointer select-none">
              <span className="mono text-xs text-stone-500 w-28 shrink-0">{formatDate(o.delivery_date)}</span>
              <Chip title="Tesco order number">#{o.order_number}</Chip>
              {o.email_type && <Chip tone="neutral" title="Email type: receipt = post-delivery, confirmation = at-order, amendment = changed before delivery">{o.email_type}</Chip>}
              <span className="flex-1 min-w-[20px]"/>
              <Chip title="Items actually delivered">{o.purchased_count||o.item_count||0} items</Chip>
              {o.substitution_count>0 && <Chip tone="warn" title="Items Tesco swapped in">{o.substitution_count} sub</Chip>}
              {o.unavailable_count>0 && <Chip tone="danger" title="Items ordered but not delivered">{o.unavailable_count} unavail</Chip>}
              {allergenLines>0 && <Chip tone="warn" title={`${allergenLines} delivered items contain a Khalil allergen`}>⚠️ {allergenLines}</Chip>}
              <Chip tone="accent" title="Total paid for this order">£{(o.total_paid_gbp||0).toFixed(2)}</Chip>
              <span className="text-xs text-stone-400">{open?'▲':'▼'}</span>
            </div>
            {open && <div className="px-3 pb-3 text-xs border-t border-stone-100 pt-2">
              {o.parse_warning && <div className="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded px-2 py-1 mb-2">⚠️ {o.parse_warning}</div>}
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead><tr className="text-stone-500"><th className="text-left py-1 w-8">Qty</th><th className="text-left">Item</th><th className="text-left w-24">Section</th><th className="text-right w-14">£/each</th><th className="text-right w-14">Total</th><th className="text-center w-20">Status</th><th className="text-center w-16">Khalil</th></tr></thead>
                  <tbody>{(o.items||[]).map((it,i)=> {
                    const k = ordersKhalilFlag(it.name);
                    return <tr key={i} className="border-t border-stone-100">
                      <td className="py-1 mono">{it.qty}</td>
                      <td>{it.name}{it.substituted_for && <div className="text-[10px] text-amber-700">↻ instead of {it.substituted_for}</div>}</td>
                      <td className="text-stone-500">{it.section||"—"}</td>
                      <td className="text-right mono">{it.unit_price_gbp!=null?`£${it.unit_price_gbp.toFixed(2)}`:"—"}</td>
                      <td className="text-right mono">{it.total_price_gbp!=null?`£${it.total_price_gbp.toFixed(2)}`:"—"}</td>
                      <td className="text-center">{it.status==="substituted"?<Chip tone="warn">sub</Chip>:it.status==="unavailable"?<Chip tone="danger">unavail</Chip>:<span className="text-stone-400">·</span>}</td>
                      <td className="text-center">{k?<Chip tone="warn">{k}</Chip>:<span className="text-emerald-600">✓</span>}</td>
                    </tr>;
                  })}</tbody>
                </table>
              </div>
            </div>}
          </div>;
        })}
      </div>
    </Section>

    <Section title="Spend by aisle" subtitle="Categorised by Tesco's order-page section"
      tip="Where the money goes. Aisle labels come straight from Tesco — 'cupboard' tends to dominate because it's a catch-all for non-fridge, non-freezer items.">
      <div className="space-y-1.5">
        {stats.sectionTotals.map(([sec, v]) => <div key={sec} className="flex items-center gap-3">
          <div className="w-28 text-sm shrink-0">{sec}</div>
          <div className="flex-1 bg-stone-100 rounded-full h-5 overflow-hidden">
            <div className="bg-teal-700 h-full" style={{width: `${(v/maxSection)*100}%`}}/>
          </div>
          <div className="mono text-xs w-16 text-right">£{v.toFixed(0)}</div>
        </div>)}
      </div>
    </Section>

    <Section title="Repeat-purchase patterns" subtitle={`${stats.trends.filter(t=>t.count>=2).length} items bought across 2+ orders`}
      tip="Items appearing in 2+ orders, sorted by order count then by total spend. Useful for identifying reliable staples to keep on auto-add.">
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-1.5">
        {stats.trends.filter(t=>t.count>=2).slice(0,30).map((t,i)=> <div key={i} className="card px-2.5 py-1.5 flex items-center justify-between text-xs gap-2">
          <span className="truncate flex-1">{t.name}</span>
          <div className="flex items-center gap-1 shrink-0">
            {t.allergen && <Chip tone="warn" title={`Contains ${t.allergen} — Khalil cannot eat`}>{t.allergen}</Chip>}
            <Chip title="Number of orders this item appeared in">×{t.count}</Chip>
            <Chip tone="accent" title="Cumulative spend across all orders">£{t.spend.toFixed(0)}</Chip>
          </div>
        </div>)}
      </div>
    </Section>

    {stats.khalilExposure.length>0 && <Section title="Khalil allergen exposure" subtitle={`${stats.khalilExposure.length} distinct items containing his allergens have been ordered`} tone="warn"
      tip="Items bought historically that Khalil can't eat. Not a problem in itself (these are for the adults), but useful context — anything frequently re-purchased may worth replacing with a Khalil-safe alternative.">
      <div className="grid sm:grid-cols-2 gap-1.5 text-xs">
        {stats.khalilExposure.slice(0,40).map((t,i)=> <div key={i} className="card px-2.5 py-1.5 flex items-center justify-between gap-2">
          <span className="truncate flex-1">{t.name}</span>
          <div className="flex items-center gap-1 shrink-0">
            <Chip tone="warn">{t.allergen}</Chip>
            <Chip title="Number of orders">×{t.count}</Chip>

          </div>
        </div>)}

    {stats.subs.length>0 && <Section title={`Substitutions · ${stats.subs.length}`} subtitle="Items Tesco swapped in"
      tip="When Tesco runs out of what you ordered, they swap in a similar item. Worth scanning for repeat substitutions — it usually means the original product needs replacing in your usual basket.">
      <div className="space-y-1 text-xs">
        {stats.subs.slice(0,20).map((s,i)=> <div key={i} className="card px-2.5 py-1.5 flex flex-wrap items-center gap-2">
          <span className="mono text-stone-500 w-28 shrink-0">{formatDate(s.delivery_date)}</span>
          <span className="text-stone-700">{s.substituted_for}</span>
          <span className="text-stone-400">→</span>
          <span className="font-medium">{s.name}</span>
        </div>)}
      </div>
    </Section>}

    {stats.unavails.length>0 && <Section title={`Unavailable items · ${stats.unavails.length}`} subtitle="Items ordered but not delivered"
      tip="Things you tried to order that Tesco couldn't fulfil and had no substitute for. Recurring entries usually mean a product is being phased out — worth finding an alternative.">

        {stats.unavails.slice(0,20).map((u,i)=> <div key={i} className="card px-2.5 py-1.5 flex flex-wrap items-center gap-2">

    </Section>}

    {stats.warnings.length>0 && <Section title={`Parse warnings · ${stats.warnings.length}`} subtitle="Orders where parsing flagged something" tone="warn"
      tip="Receipts where the parser noticed something odd — usually a truncated email body where line items didn't add up to the order total. Treat these orders' line-item lists as incomplete.">
      <div className="space-y-1 text-xs">
        {stats.warnings.map((w,i)=> <div key={i} className="card px-2.5 py-1.5">
          <span className="mono text-stone-500 mr-2">#{w.order_number}</span> {w.parse_warning}

  </div>;

// ===== Gaps view: regular Tesco purchases not currently in the pantry =====
// Note: receipts are no longer a module-level constant — they're fetched from
// Supabase at boot and exposed via ReceiptsContext. The helpers below
// (buildPriceIndex, computeRegularsAndGaps, suggestNextDelivery) all take
// the receipts array as a parameter; their callers pull it from context.
const HOUSEHOLD_RULES = RAW.household_rules || { never_restock: [] };

// Normalise a Tesco product name into a rough "product family" key — strips pack sizes, dagger marks, etc.
// Product-family taxonomy. Maps a Tesco product description to a generic
// "family" key like "peanut butter" or "salmon fillets", regardless of brand,
// pack size, or descriptor noise. The first matching pattern wins, so order
// matters — more specific patterns first.
//
// Each row: [family_key, regex|substring]. Family keys mirror pantry items
// where possible so cross-referencing is automatic.
const PRODUCT_FAMILIES = [
  // ----- DAIRY / CHEESE (specific cheeses before generic "cheese") -----
  ["mozzarella",            /\bmozzarella\b/],
  ["cheddar",               /\bcheddar\b/],
  ["parmesan",              /\bparmigiano|parmesan\b/],
  ["feta",                  /\bfeta\b/],
  ["paneer",                /\bpaneer\b/],
  ["boursin",               /\bboursin\b/],
  ["red leicester",         /\bred leicester\b/],
  ["cream cheese",          /cream cheese|cheese spread/],
  ["sliced cheese",         /\bcheese slices?\b/],
  ["greek yoghurt",         /(greek|skyr|fage|total)[^.]*yog(h)?urt/],
  ["yoghurt",               /\byog(h)?urt|oatgurt\b/],
  ["double cream",          /double cream|elmlea/],
  ["butter",                /\bunsalted butter|salted butter|stork|baking spread\b/],
  ["whole milk",            /whole milk|cravendale/],
  ["semi skimmed milk",     /semi[- ]skimmed/],
  ["skimmed milk",          /skimmed milk|skimmed longlife/],
  ["flavoured milk",        /flavoured milk/],
  ["oat milk",              /oat (milk|drink)|oatly(?! greek)/],
  ["soya milk",             /soya milk|soy milk|alpro soya|plenish.*soya/],

function normaliseProductName(name){
  // Strip dagger/leading marks, then try to match a product family.
  let n = (name||"").toLowerCase();
  n = n.replace(/^\s*[†‡*\u2020\u00a0]+\s*/, "");
  n = n.replace(/\s+/g, " ").trim();
  for (const [family, pattern] of PRODUCT_FAMILIES) {
    if (pattern instanceof RegExp) {
      if (pattern.test(n)) return family;
    } else if (n.includes(pattern)) {
      return family;
    }
  }
  // Fallback: strip pack sizes and use what's left
  let cleaned = n;
  cleaned = cleaned.replace(/\b\d+\s*(g|kg|ml|l|cl|pack|x|pk|each)\b.*$/i, "");
  cleaned = cleaned.replace(/\b\d+\s*x\s*\d+.*$/i, "");
  return cleaned.replace(/\s+/g, " ").trim();
}

// Khalil-allergen detection on a product name (loose, only for tagging the gap
// view). Takes the allergens config so the token list stays in sync with
// Supabase. Returns a coarse category label ('wheat' | 'dairy' | 'eggs' |
// 'beef' | 'tree nut' | 'legumes' | 'avocado') or null if no allergen match.
//
// The token list comes from `allergens.khalil.blockByCategory` (built from
// Supabase). The special-case logic (gluten-free exemption, butternut/
// butterhead disambiguation, coconut/peanut "butter" exceptions) is preserved
// from the original regex-based implementation — those are nuances about
// English product naming, not allergen facts, so they live in code.
function khalilAllergenFlag(name, allergens){
  if (!name) return null;
  // Validate shape rather than just truthiness — a non-config truthy value
  // (e.g. a number passed in the wrong arg position) used to white-screen
  // the app in 14.5. Now we degrade to EMPTY_ALLERGENS instead.
  const a = (allergens && typeof allergens === 'object' && allergens.khalil)
    ? allergens : EMPTY_ALLERGENS;
  const n = name.toLowerCase();
  const cats = a.khalil.blockByCategory || {};

  // Gluten-free / free-from products are exempt from the wheat category.
  const glutenFree = n.includes("gluten free") || n.includes("gluten-free") || n.includes("free from");

  // Tokens we explicitly do NOT want to flag as dairy even though they
  // contain the substring "butter"/"milk"/"cream". Sourced from the
  // khalil safe_phrases list + a couple of name-disambiguation cases
  // (butternut squash, butterhead lettuce).
  const dairyExceptions = [...(a.khalil.safe || []), "butternut", "butterhead"];
  const looksDairyExempt = dairyExceptions.some(p => n.includes(p));

  // Categories are checked in priority order — wheat before legumes (so
  // "kidney bean pasta" still gets flagged), dairy before tree-nuts (so
  // "almond milk" lands as dairy, which is the right answer for Khalil),
  // etc. Preserve the original audit ordering.
  const order = ['wheat', 'dairy', 'eggs', 'beef', 'tree_nuts', 'legumes', 'avocado'];
  for (const cat of order) {
    const tokens = cats[cat] || [];
    for (const tok of tokens) {
      if (!hasToken(n, tok)) continue;
      // Per-category exemptions
      if (cat === 'wheat' && glutenFree) continue;
      if (cat === 'dairy' && looksDairyExempt) continue;
      // Map internal category name to display label (matches old return values)
      return cat === 'tree_nuts' ? 'tree nut' : cat;
    }
  }
  return null;
}

// Household-rules: should this product be excluded from "restock" suggestions?
function neverRestockReason(name){
  const n = (name||"").toLowerCase();
  for (const r of (HOUSEHOLD_RULES.never_restock||[])) {
    if (n.includes(r.pattern)) return r.reason;
  }
  return null;
}

// ===== Basket suggestion: shared logic across Planner & Gaps =====
//
// Build a price index from Tesco order history. For each normalised product family,
// collect all (purchased, priced) instances and take the median total price as the
// expected per-pack price.
// Extract a pack size string from a product name (e.g. "Tesco Boneless Salmon Fillets 4 Pack 520g" → "520g").
// Returns the most specific size token found, or null.
function extractPackSize(name){
  if (!name) return null;
  const n = String(name);
  // Prefer weight/volume tokens (e.g. "520g", "1.5kg", "400ml", "1L"). Case-insensitive, allows decimals.
  const wt = n.match(/(\d+(?:\.\d+)?)\s*(g|kg|ml|l|cl)\b/i);
  if (wt) return `${wt[1]}${wt[2].toLowerCase()}`;
  // Pack-count tokens (e.g. "4 Pack", "6 Pack", "2X76g" already caught above).
  const pk = n.match(/(\d+)\s*(?:pack|x|each)\b/i);
  if (pk) return `${pk[1]} pack`;
  return null;
}

function buildPriceIndex(receipts){
  const byFamily = new Map(); // family-key -> { unitPrices:[], orderQtys:[], sizes:Map<size,count> }
  for (const o of (receipts||[])) {
    for (const it of (o.items||[])) {
      if (it.status === "unavailable") continue;
      const k = normaliseProductName(it.name);
      if (!k) continue;
      if (!byFamily.has(k)) byFamily.set(k, { unitPrices: [], orderQtys: [], sizes: new Map() });
      const entry = byFamily.get(k);
      // Compute per-unit price: prefer the explicit unit_price_gbp, fall back to total / qty.
      const qty = (it.qty != null && it.qty > 0) ? it.qty : 1;
      let unitPrice = null;
      if (it.unit_price_gbp != null) unitPrice = it.unit_price_gbp;
      else if (it.total_price_gbp != null) unitPrice = it.total_price_gbp / qty;
      if (unitPrice != null) entry.unitPrices.push(unitPrice);
      if (it.qty != null && it.qty > 0) entry.orderQtys.push(it.qty);
      const size = extractPackSize(it.name);
      if (size) entry.sizes.set(size, (entry.sizes.get(size) || 0) + 1);
    }
  }
  const familyMedians = new Map();
  for (const [k, v] of byFamily) {
    if (!v.unitPrices.length) continue;
    const sortedPrices = v.unitPrices.slice().sort((a,b)=> a-b);
    const unitMedian = sortedPrices[Math.floor(sortedPrices.length/2)];
    // Typical qty: median qty across orders where this family was bought.
    let typicalQty = 1;
    if (v.orderQtys.length) {
      const sortedQtys = v.orderQtys.slice().sort((a,b)=> a-b);
      typicalQty = sortedQtys[Math.floor(sortedQtys.length/2)] || 1;
    }
    // Most-common size token
    let topSize = null, topSizeCount = 0;
    for (const [size, n] of v.sizes) if (n > topSizeCount) { topSize = size; topSizeCount = n; }
    familyMedians.set(k, { unitMedian, sample: v.unitPrices.length, typicalQty, packSize: topSize });
  }
  return familyMedians;
}

// Loose lookup: given a free-form ingredient name (from a recipe), try to find a
// matching Tesco family price. Returns { unitGbp, totalGbp, packSize, typicalQty, source, matchedFamily } or null.
function lookupPriceForIngredient(name, priceIndex){
  if (!name) return null;
  const n = lc(name);
  const wrap = (info, family, source) => ({
    unitGbp: info.unitMedian,
    totalGbp: info.unitMedian * info.typicalQty,
    packSize: info.packSize,
    typicalQty: info.typicalQty,
    matchedFamily: family,
    source,
  });
  // 1) Direct family-key match
  const direct = normaliseProductName(name);
  if (direct && priceIndex.has(direct)) {
    return wrap(priceIndex.get(direct), direct, "direct");
  }
  // 2) Substring match against family keys (best-fit by length of overlap)
  let best = null;
  for (const [fam, info] of priceIndex) {
    if (n.includes(fam) || fam.includes(n)) {
      const overlap = Math.min(n.length, fam.length);
      if (!best || overlap > best.overlap) best = { fam, info, overlap };
    }
  }
  if (best) return wrap(best.info, best.fam, "fuzzy");
  return null;
}

// Compute the suggested delivery date from past order cadence.
// Returns { date: "YYYY-MM-DD", note: "..." }
function suggestNextDelivery(receipts){
  const orders = receipts || [];
  if (orders.length < 2) {
    return { date: null, note: "Not enough order history to estimate cadence." };
  }
  // Average gap in days between consecutive deliveries (use last ~6 to weight recent behaviour)
  const recent = orders.slice(-6);
  const gaps = [];
  for (let i = 1; i < recent.length; i++) {
    const a = new Date(recent[i-1].delivery_date + "T12:00:00Z");
    const b = new Date(recent[i].delivery_date + "T12:00:00Z");
    const d = Math.round((b - a) / (24*60*60*1000));
    if (d > 0 && d < 60) gaps.push(d);
  }
  if (!gaps.length) return { date: null, note: "Order cadence is too irregular to estimate." };
  const avgGap = Math.round(gaps.reduce((s,n)=>s+n, 0) / gaps.length);
  const latest = orders[orders.length - 1].delivery_date;
  const latestDate = new Date(latest + "T12:00:00Z");
  const proposedDate = new Date(latestDate.getTime() + avgGap * 24*60*60*1000);
  // Never propose a date earlier than tomorrow
  const tomorrow = new Date(TODAY.getTime() + 24*60*60*1000);
  const finalDate = proposedDate < tomorrow ? tomorrow : proposedDate;
  const iso = finalDate.toISOString().slice(0, 10);
  const weekday = finalDate.toUTCString().slice(0, 3);
  return {
    date: iso,
    weekday,
    note: `Based on a ${avgGap}-day average across your last ${recent.length} deliveries (latest: ${latest}).`,
    avgGap,
  };
}

// Re-runs the Gaps tab's regulars-vs-pantry analysis. Returns null if no orders.
// TODO(refactor): return shape still includes `latestIdx` which makes callers
// re-index into the receipts array to grab the latest order. Could return
// `latest` directly and drop `latestIdx`. Deferred from 14.4 to avoid bundling
// a shape change with the receipts-param refactor.
function computeRegularsAndGaps(pantry, receipts, allergens, minOrders=3){
  const orders = receipts || [];
  if (!orders.length) return null;
  const latestIdx = orders.length - 1;

  const fam = new Map();
  orders.forEach((o, i) => {
    (o.items||[]).forEach(it => {
      if (it.status === "unavailable") return;
      const k = normaliseProductName(it.name);
      if (!k) return;
      if (!fam.has(k)) fam.set(k, { example: it.name, orderIdxs: new Set(), lastSeenDate: o.delivery_date, counts: new Map() });
      const entry = fam.get(k);
      entry.orderIdxs.add(i);
      if ((o.delivery_date||"") > (entry.lastSeenDate||"")) entry.lastSeenDate = o.delivery_date;
      entry.counts.set(it.name, (entry.counts.get(it.name)||0) + 1);
    });
  });
  for (const v of fam.values()) {
    let best = null, bestN = -1;
    for (const [n, c] of v.counts) if (c > bestN) { best = n; bestN = c; }
    v.example = best;
    delete v.counts;
  }

  const pantryKeys = new Set(pantry.map(p => p.item.toLowerCase()));
  const regulars = [];
  for (const [key, v] of fam) {
    const count = v.orderIdxs.size;
    if (count < minOrders) continue;
    const inLatest = v.orderIdxs.has(latestIdx);
    let pantryItem = null;
    for (const pk of pantryKeys) {
      if (key.includes(pk) || (v.example||"").toLowerCase().includes(pk)) { pantryItem = pk; break; }
    }
    if (!pantryItem) pantryItem = findPantryMatch(v.example);
    const allergen = khalilAllergenFlag(v.example, allergens);
    const excluded = neverRestockReason(v.example);
    regulars.push({
      key, example: v.example, count, inLatest, lastSeenDate: v.lastSeenDate,
      pantryItem, allergen, excludedReason: excluded,
    });
  }
  regulars.sort((a,b)=> b.count - a.count || (a.lastSeenDate||"").localeCompare(b.lastSeenDate||""));
  const gaps = regulars.filter(r => !r.pantryItem && !r.inLatest && !r.excludedReason);
  return { regulars, gaps, latestIdx };
}

function GapsView({pantry, outOfStock}){
  // Receipts come from ReceiptsContext (commit 14.4). The Gaps view's whole
  // job is comparing pantry against order history, so this is the core input.
  const receipts = useContext(ReceiptsContext);
  const allergens = useContext(AllergensContext);
  const [minOrders, setMinOrders] = useState(3);
  const [filter, setFilter] = useState("gap"); // gap | all | restocked | excluded
  const [leverageLimit, setLeverageLimit] = useState(15);

  // Leverage: ingredients that unlock the most blocked recipes
  const leverage = useMemo(()=>{
    const matchSet = pantryMatchSet(pantry, outOfStock);
    const decorated = RECIPES.map(r=>{
      const f = flagsForRecipe(r, allergens);
      return {...r, _flags:f, _audience: r.audience || audienceFromFlags(f)};
    });
    // Filter to household-safe recipes by default so we don't suggest adding ingredients to unlock Khalil-blocked meals
    const eligible = decorated.filter(r => r._flags.khalil !== "blocked");
    return leverageScore(eligible, matchSet, leverageLimit);
  }, [pantry, outOfStock, leverageLimit, allergens]);

  const analysis = useMemo(()=>{
    const base = computeRegularsAndGaps(pantry, receipts, allergens, minOrders);
    if (!base) return null;
    const latest = receipts[base.latestIdx];
    const restocked = base.regulars.filter(r => r.inLatest || r.pantryItem);
    const excluded = base.regulars.filter(r => r.excludedReason);
    return {
      latest,
      latestIdx: base.latestIdx,
      orderCount: receipts.length,
      regulars: base.regulars,
      gaps: base.gaps,
      restocked,
      excluded,
    };
  }, [pantry, receipts, allergens, minOrders]);

  if (!analysis) {
    return <div className="card p-4 text-sm text-stone-500">
      No Tesco order history loaded yet. Receipts are fetched from Supabase on page load — if this persists, check the network tab or browser console.
    </div>;
  }

  const visible = filter === "gap" ? analysis.gaps
                : filter === "restocked" ? analysis.restocked
                : filter === "excluded" ? analysis.excluded

  return <div className="space-y-5">
    <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
      <Stat label="Orders tracked" value={analysis.orderCount}
        tip="Number of Tesco orders parsed from receipts. The more orders, the more reliable the 'regulars' detection."/>

      <Stat label="Real gaps" value={analysis.gaps.length} tone={analysis.gaps.length>0?"warn":"ok"}

      <Stat label="Excluded by rules" value={analysis.excluded.length} tone="info"

function GapCard({label, value, of, severity, note}){
  const tone = severity==="high"?"danger":severity==="medium"?"warn":"ok";
  const sevTitle = severity==="high" ? "High severity — fix before relying on this data"
    : severity==="medium" ? "Medium severity — small fix recommended"
    : "Low severity — all good";
  return <div className="card p-3">
    <div className="flex items-start justify-between gap-2 mb-1">
      <div className="font-medium text-sm leading-snug">{label}</div>
      <Chip tone={tone} title={sevTitle}>{severity}</Chip>
    </div>
    <div className="mono text-xs text-stone-500 mb-1.5">{value}{of!==undefined && of!=="—" ? ` / ${of}`:""}</div>
    <div className="text-xs text-stone-600 leading-snug">{note}</div>
  </div>;
}

// ===== Root =====
function App(){
  const initialState = STORAGE_OK ? loadState() : null;
  const [tab, setTab] = useState(initialState?.tab || "planner");

  // ---- Async data loaded from Supabase ----
  const [pantry, setPantry] = useState([]);
  const [cooked, setCooked] = useState(initialState?.cooked || []);
  // Receipts (tesco_orders, eventually all retailers). Fetched from
  // Supabase with embedded receipt_items. Consumed via ReceiptsContext.
  // OrdersView, PlannerView, GapsView, and the App footer all read from
  // the context; the price-index / cadence / gap-analysis helpers take
  // receipts as a parameter (commit 14.4).
  const [receipts, setReceipts] = useState([]);
  // Household allergens (Khalil/Max/Emily token lists). Fetched from the
  // household_allergens Supabase table on boot (commit 14.5). Default is
  // EMPTY_ALLERGENS so flagsForRecipe and khalilAllergenFlag degrade
  // gracefully before the fetch resolves — recipes will momentarily appear
  // Khalil-safe, then re-render correctly once the data lands. This
  // window is ~100ms in practice; for a longer-term solution we'd seed
  // from localStorage like pantry does.
  const [allergens, setAllergens] = useState(EMPTY_ALLERGENS);
  // recipesLoaded triggers a re-render once the module-level RECIPES
  // array has been populated (it's read directly by many components).
  const [recipesLoaded, setRecipesLoaded] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);

  // outOfStock and qtyAdjustments are now sourced from the pantry rows
  // themselves (out_of_stock, qty_adjustment columns). They're mirrored
  // into React state for fast UI reads — the canonical store is Supabase.
  // Handlers below (toggleOutOfStock, adjustQty) update local state
  // optimistically, fire a PATCH in the background, and roll back local
  // state if the PATCH fails. Qty adjustments are debounced so rapid
  // +/- taps coalesce into a single network write.
  const [outOfStock, setOutOfStock] = useState(new Set(initialState?.outOfStock || []));
  const [qtyAdjustments, setQtyAdjustments] = useState(initialState?.qtyAdjustments || {});
  // Track per-item sync errors so the UI can surface a "not synced" hint.
  // Keyed by item name (matches outOfStock/qtyAdjustments shape).
  const [syncErrors, setSyncErrors] = useState({}); // {itemName: errorMessage}
  // Same idea for cooked-log writes. Keyed by meal_id since that's the stable
  // identifier on the recipe card (a meal can be marked/unmarked many times).
  const [cookedSyncErrors, setCookedSyncErrors] = useState({}); // {meal_id: errorMessage}

  const [eaterFilter, setEaterFilter] = useState(initialState?.eaterFilter || "all");
  const [showStorageNote, setShowStorageNote] = useState(STORAGE_OK ? false : true);
  // Help banner — auto-dismisses after first dismissal, remembered in localStorage
  const [showHelpBanner, setShowHelpBanner] = useState(() => {
    if (!STORAGE_OK) return true;
    try { return localStorage.getItem(LS_KEY + ':help-dismissed') !== '1'; } catch { return true; }
  });
  const dismissHelpBanner = useCallback(() => {
    setShowHelpBanner(false);
    if (STORAGE_OK) { try { localStorage.setItem(LS_KEY + ':help-dismissed', '1'); } catch {} }
  }, []);

  // ---- Fetch pantry + recipes + cooked log + receipts on mount ----
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const [pantryRows, recipeRows, cookedRows, receiptRows, allergenRows] = await Promise.all([
          fetchPantry(),
          fetchRecipes(),
          fetchCookedLog().catch(() => []), // cooked_log is empty / may not have read perms
          fetchReceipts().catch((e) => { console.warn("fetchReceipts failed:", e); return []; }),
          fetchHouseholdAllergens().catch((e) => { console.warn("fetchHouseholdAllergens failed:", e); return []; }),
        ]);
        if (cancelled) return;
        const mappedPantry = pantryRows.map(mapPantryRow);
        setPantry(mappedPantry);
        // Seed outOfStock + qtyAdjustments from the row data. Supabase is
        // canonical (commit 14.5) — the boot fetch overwrites whatever
        // localStorage had, so a change made on one device is reflected
        // on every other device on next page load.
        //
        // Previous behaviour (pre-14.5) merged local state on top of the
        // fetched data with "local wins" semantics, which was correct
        // before pantry writes synced to Supabase but became a cross-
        // device sync bug afterwards: localStorage on device B would
        // clobber device A's writes on every load.
        //
        // localStorage is still used for first-paint (the initial
        // useState seed) so the UI feels instant before the fetch lands,
        // and as a fallback if Supabase is unreachable — but once the
        // fetch returns, the server's view replaces the local one.
        const oos = new Set(mappedPantry.filter(p => p._out_of_stock).map(p => p.item));
        setOutOfStock(oos);
        const adj = {};
        for (const p of mappedPantry) if (p._qty_adjustment) adj[p.item] = p._qty_adjustment;
        setQtyAdjustments(adj);

        setRecipes(recipeRows.map(mapRecipeRow));
        setRecipesLoaded(true);

        // Receipts: map and store. Each receipt has its items embedded
        // via the PostgREST select=*,receipt_items(*) join — see
        // mapReceiptRow for the shape translation.
        setReceipts((receiptRows || []).map(mapReceiptRow));

        // Allergens: flatten Supabase rows into the nested config shape
        // (see buildAllergensConfig). If the fetch failed (allergenRows
        // is empty), we keep the EMPTY_ALLERGENS default, which means
        // recipes will display as Khalil-safe — visually that should be
        // obvious enough to spot, since the family knows real recipes
        // include flagged items. Worth adding an explicit error banner
        // here in a future commit if this turns out to fail in practice.
        if (allergenRows && allergenRows.length) {
          setAllergens(buildAllergensConfig(allergenRows));
        } else {
          console.warn("Allergens fetch returned no rows — flagging will be disabled.");
        }

        // Merge any server-side cooked log with local cooked log,
        // de-duped by meal_id+date. Server rows are mapped through
        // mapCookedRow first so they share the local entry shape
        // (meal_id/date rather than recipe_id/cooked_date).
        if (cookedRows && cookedRows.length) {
          const seen = new Set((initialState?.cooked || []).map(c => `${c.meal_id}|${c.date}`));
          const merged = [...(initialState?.cooked || [])];
          for (const raw of cookedRows) {
            const r = mapCookedRow(raw);
            const key = `${r.meal_id}|${r.date}`;
            if (!seen.has(key)) { merged.push(r); seen.add(key); }
          }
          setCooked(merged);
        }
        setLoading(false);
      } catch (err) {
        if (!cancelled) {
          console.error("Failed to load data from Supabase:", err);
          setLoadError(err.message || String(err));
          setLoading(false);
        }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Persist on changes (local cache; Supabase is canonical)
  useEffect(()=>{
    if (!STORAGE_OK || loading) return;
    saveState({
      tab, cooked, outOfStock: [...outOfStock], qtyAdjustments, eaterFilter,
      version: 1, savedAt: new Date().toISOString(),
    });
  }, [tab, cooked, outOfStock, qtyAdjustments, eaterFilter, loading]);

  const tabs = [
    ["planner","Planner", "What to cook this week, grouped by what's expiring, what's whole-household-safe, and what's high-protein."],
    ["recipes","Recipes", "Search and filter every recipe in your library. Sort by makeability, protein, or prep time."],
    ["pantry","Pantry", "Everything currently in the kitchen, with expiry and confidence tracking. Mark items out of stock if you've used them up."],
    ["tesco","Orders", "Past Tesco deliveries — spend trends, repeat purchases, substitutions, and Khalil allergen exposure. Read-only."],
    ["gaps","Gaps", "Items you buy regularly that are missing from both your latest order and the pantry — candidates for the next basket."],
    ["audit","Stats", "Library health check — recipe coverage, allergen tagging, and audience breakdown by source."],
  ];

  const currentTabMeta = tabs.find(t => t[0] === tab);

  // Helper to set / clear a cooked-log sync error for a given meal_id.
  const setCookedSyncError = useCallback((mealId, message) => {
    setCookedSyncErrors(prev => {
      const next = {...prev};
      if (message) next[mealId] = message; else delete next[mealId];
      return next;
    });
  }, []);

  // Optimistic toggle of "cooked" status. Mirrors patchPantryRow's pattern:
  // update local state immediately, fire insert/delete in the background,
  // roll back on failure and surface an error via cookedSyncErrors.
  //
  // Adds: POST to cooked_log; on success, attach the server-assigned id to
  //   the local entry (used for later deletes).
  // Removes: DELETE by id; if the local entry has no id (legacy localStorage
  //   state from before this sync existed), fall back to local-only removal
  //   with a console warning.
  const addCooked = useCallback((r) => {
    const today = new Date().toISOString().slice(0,10);
    const existingIdx = cooked.findIndex(c => c.meal_id === r.id);
    const isRemove = existingIdx >= 0;
    setCookedSyncError(r.id, null);

    if (isRemove) {
      // ----- REMOVE path -----
      const removed = cooked[existingIdx];
      // 1. Optimistic local removal
      setCooked(prev => {
        const copy = prev.slice();
        const i = copy.findIndex(c => c.meal_id === r.id);
        if (i >= 0) copy.splice(i, 1);
        return copy;
      });
      // 2. If we don't have a server id, this was a legacy local-only entry
      // — nothing to delete server-side.
      if (!removed.id) {
        console.warn(`addCooked: removing "${r.name}" but local entry has no server id — skipping DELETE`);
        return;
      }
      // 3. Fire DELETE in background
      deleteCookedLog(removed.id)
        .catch(err => {
          console.error(`Failed to delete cooked_log for "${r.name}":`, err);
          // Roll back: re-insert at the same position.
          setCooked(prev => {
            const copy = prev.slice();
            copy.splice(existingIdx, 0, removed);
            return copy;
          });
          setCookedSyncError(r.id, "Couldn't save — tap again to retry");
        });
    } else {
      // ----- ADD path -----
      const localEntry = {
        date: today,
        meal_id: r.id,
        source: r._source_file,
        name: r.name,
        audience: r._audience,
        protein_per_serving_g: r.protein_per_serving_g,
      };
      // 1. Optimistic local insert (no id yet — added when POST succeeds)
      setCooked(prev => [...prev, localEntry]);
      // 2. Map local shape → DB columns and POST
      const payload = {
        recipe_id: r.id,
        cooked_date: today,
        recipe_name: r.name,
        source_file: r._source_file,
        audience: r._audience,
        protein_per_serving_g: r.protein_per_serving_g,
      };
      insertCookedLog(payload)
        .then(rows => {
          // Attach server-assigned id to the local entry so a later un-mark
          // can DELETE it by id rather than guessing.
          const serverId = rows && rows[0] && rows[0].id;
          if (serverId) {
            setCooked(prev => prev.map(c =>
              (c.meal_id === r.id && c.date === today && !c.id)
                ? {...c, id: serverId}
                : c
            ));
          }
        })
        .catch(err => {
          console.error(`Failed to insert cooked_log for "${r.name}":`, err);
          // Roll back the local insert.
          setCooked(prev => prev.filter(c =>
            !(c.meal_id === r.id && c.date === today && !c.id)
          ));
          setCookedSyncError(r.id, "Couldn't save — tap again to retry");
        });
    }
  }, [cooked, setCookedSyncError]);

  // Keep a ref to the current pantry so handlers (wrapped in useCallback([]))
  // can resolve item-name → id without going stale on every pantry update.
  const pantryRef = useRef(pantry);
  useEffect(() => { pantryRef.current = pantry; }, [pantry]);

  // Helper: find an item's row by name. Returns undefined if not found
  // (e.g. local-only out-of-stock mark that doesn't match any row).
  const findRowByItem = useCallback((itemName) => {
    return (pantryRef.current || []).find(p => p.item === itemName);
  }, []);

  // Helper: set / clear a sync error for a given item.
  const setItemSyncError = useCallback((itemName, message) => {
    setSyncErrors(prev => {
      const next = {...prev};
      if (message) next[itemName] = message; else delete next[itemName];
      return next;
    });
  }, []);

  // Optimistic update + PATCH + rollback on failure.
  // Reverses the local state change if Supabase rejects the write.
  const toggleOutOfStock = useCallback((itemName) => {
    const row = findRowByItem(itemName);
    if (!row) {
      // No matching pantry row — fall back to local-only (legacy behaviour).
      // Shouldn't happen in normal use, but keeps UI responsive if data is odd.
      setOutOfStock(prev => {
        const next = new Set(prev);
        if (next.has(itemName)) next.delete(itemName); else next.add(itemName);
        return next;
      });
      return;
    }
    const wasOut = outOfStock.has(itemName);
    const newOut = !wasOut;
    // 1. Optimistic local update
    setOutOfStock(prev => {
      const next = new Set(prev);
      if (newOut) next.add(itemName); else next.delete(itemName);
      return next;
    });
    setItemSyncError(itemName, null);
    // 2. Fire PATCH in background
    patchPantryRow(row.id, { out_of_stock: newOut })
      .then(() => {
        // 3a. Success: also reflect change on the local pantry row so a
        // later refresh / re-render uses the canonical value.
        setPantry(prev => prev.map(p => p.id === row.id ? {...p, _out_of_stock: newOut} : p));
      })
      .catch(err => {
        // 3b. Failure: roll back the local state change.
        console.error(`Failed to sync out_of_stock for "${itemName}":`, err);
        setOutOfStock(prev => {
          const next = new Set(prev);
          if (wasOut) next.add(itemName); else next.delete(itemName);
          return next;
        });
        setItemSyncError(itemName, "Couldn't save — tap again to retry");
      });
  }, [outOfStock, findRowByItem, setItemSyncError]);

  // Debounced qty PATCH. Multiple rapid +/- taps coalesce into one network
  // call carrying the final value. Per-item timers so different items don't
  // share a debounce window.
  const qtyDebounceTimers = useRef({}); // {itemName: timeoutId}
  // Track the latest pending qty_adjustment value per item, so the debounced
  // PATCH (firing after the React state update completes) sends the most
  // recent value. Reading from React state directly inside setTimeout would
  // require another useRef on qtyAdjustments — this is simpler.
  const pendingQtyValues = useRef({}); // {itemName: latestValue}
  const adjustQty = useCallback((itemName, delta) => {
    const row = findRowByItem(itemName);
    // Compute the new value synchronously (without going through setState),
    // then update React state and schedule the debounced PATCH separately.
    const prevVal = (pendingQtyValues.current[itemName] !== undefined)
      ? pendingQtyValues.current[itemName]
      : (qtyAdjustments[itemName] || 0);
    const newVal = prevVal + delta;
    pendingQtyValues.current[itemName] = newVal;
    // Update React state
    setQtyAdjustments(prev => {
      const next = {...prev};
      if (newVal === 0) delete next[itemName]; else next[itemName] = newVal;
      return next;
    });
    // No row → local-only (legacy)
    if (!row) return;
    // Schedule the debounced PATCH
    clearTimeout(qtyDebounceTimers.current[itemName]);
    const prevSaved = row._qty_adjustment || 0; // last known server value
    qtyDebounceTimers.current[itemName] = setTimeout(() => {
      setItemSyncError(itemName, null);
      patchPantryRow(row.id, { qty_adjustment: newVal })
        .then(() => {
          // Reflect new server value on the canonical row.
          setPantry(prev => prev.map(p => p.id === row.id ? {...p, _qty_adjustment: newVal} : p));
          delete pendingQtyValues.current[itemName];
        })
        .catch(err => {
          console.error(`Failed to sync qty_adjustment for "${itemName}":`, err);
          // Roll back to the last known server value.
          setQtyAdjustments(prevAdj => {
            const r = {...prevAdj};
            if (prevSaved === 0) delete r[itemName]; else r[itemName] = prevSaved;
            return r;
          });
          pendingQtyValues.current[itemName] = prevSaved;
          setItemSyncError(itemName, "Couldn't save — tap again to retry");
        });
    }, 150);
  }, [qtyAdjustments, findRowByItem, setItemSyncError]);

  // Flush any pending debounced qty PATCHes synchronously on page hide. The
  // 150ms debounce in adjustQty coalesces rapid +/- taps into one network
  // call, but if the user refreshes / backgrounds the app inside that 150ms
  // window the setTimeout is killed before it fires — Supabase never sees
  // the write, and the next boot fetch wipes the local optimistic update.
  // Especially likely on mobile, where iOS Safari pauses JS timers on
  // app-switch and pull-to-refresh.
  //
  // Fix: on `pagehide` (the canonical "page is going away" event, fires on
  // refresh + tab close + iOS background) and `visibilitychange→hidden`,
  // synchronously flush every pending value using fetch({keepalive: true}).
  // `keepalive` tells the browser to complete the request even after the
  // page unloads — purpose-built for this.
  //
  // Note: this is fire-and-forget. We can't observe success/failure since
  // the page is going away. The next boot fetch is our verification —
  // if the PATCH landed, the row will reflect it; if it didn't, the
  // localStorage seed has the latest value and the user can re-tap.
  useEffect(() => {
    const flush = () => {
      const pending = pendingQtyValues.current;
      const items = Object.keys(pending);
      if (!items.length) return;
      for (const itemName of items) {
        const newVal = pending[itemName];
        const row = (pantryRef.current || []).find(p => p.item === itemName);
        if (!row || !row.id) continue;
        // Cancel any in-flight debounced setTimeout for this item so it
        // doesn't fire a duplicate PATCH if the page actually survives
        // (e.g. visibilitychange→hidden→visible without a real unload).
        clearTimeout(qtyDebounceTimers.current[itemName]);
        try {
          fetch(`${SUPABASE.url}/rest/v1/pantry_items?id=eq.${row.id}`, {
            method: "PATCH",
            headers: {
              apikey: SUPABASE.anonKey,
              Authorization: `Bearer ${SUPABASE.anonKey}`,
              "Content-Type": "application/json",
              Prefer: "return=minimal",
            },
            body: JSON.stringify({ qty_adjustment: newVal }),
            keepalive: true,
          });
        } catch (e) {
          // Nothing useful to do here — the page is unloading. The local
          // optimistic state is in localStorage; user re-taps on next visit
          // if needed.
          console.warn(`Flush PATCH for "${itemName}" failed:`, e);
        }
      }
      // Don't clear pendingQtyValues — if the page survives (visibilitychange
      // path), the in-memory debounce machinery will overwrite anyway, and
      // if it doesn't survive, the ref dies with the page.
    };
    const onVisibility = () => {
      if (document.visibilityState === "hidden") flush();
    };
    window.addEventListener("pagehide", flush);
    document.addEventListener("visibilitychange", onVisibility);
    return () => {
      window.removeEventListener("pagehide", flush);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  const exportAll = () => {
    const blob = new Blob([JSON.stringify({
      cooked, outOfStock: [...outOfStock], qtyAdjustments, exported_at: new Date().toISOString()
    }, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`grocery-state-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const clearAll = () => {
    if (confirm("Clear ALL saved data (cooked log, marked-out items, qty adjustments)? This cannot be undone.")) {
      setCooked([]); setOutOfStock(new Set()); setQtyAdjustments({}); setSyncErrors({}); setCookedSyncErrors({});
      try { localStorage.removeItem(LS_KEY); } catch {}
    }
  };

  const expiringCount = pantry.filter(p=>!outOfStock.has(p.item) && daysUntilExpiry(p)!==null && daysUntilExpiry(p)<=5).length;
  const orderCount = receipts.length;

  // ---- Loading + error gates ----
  if (loading) {
    return <div className="max-w-7xl mx-auto px-4 sm:px-6 py-20 text-center">
      <div className="inline-block animate-spin rounded-full h-10 w-10 border-2 border-stone-300 border-t-stone-800 mb-4"></div>
      <p className="text-stone-500 text-sm">Loading pantry and recipes from Supabase…</p>
    </div>;
  }
  if (loadError) {
    return <div className="max-w-2xl mx-auto px-4 sm:px-6 py-20">
      <div className="card p-6">
        <h2 className="text-lg font-semibold mb-2">Couldn't reach Supabase</h2>
        <p className="text-sm text-stone-600 mb-3">The dashboard needs to fetch pantry and recipe data from your Supabase project. The request failed with:</p>
        <pre className="mono text-xs bg-stone-100 p-3 rounded mb-3 overflow-x-auto">{loadError}</pre>
        <p className="text-sm text-stone-600">Common causes: (1) the project URL or anon key in <span className="mono">CONFIG</span> is wrong, (2) RLS is enabled with no SELECT policy, (3) you're offline. Check the browser console for details and reload once fixed.</p>
        <button onClick={()=>location.reload()} className="pill mt-4">Reload</button>
      </div>
    </div>;
  }
  if (!recipesLoaded || pantry.length === 0) {
    return <div className="max-w-2xl mx-auto px-4 sm:px-6 py-20">
      <div className="card p-6">
        <h2 className="text-lg font-semibold mb-2">No data returned</h2>
        <p className="text-sm text-stone-600">Supabase responded but the pantry or recipes table was empty. If you just created the tables, double-check the rows imported correctly.</p>
        <button onClick={()=>location.reload()} className="pill mt-4">Reload</button>
      </div>
    </div>;
  }

  return <ReceiptsContext.Provider value={receipts}>
  <AllergensContext.Provider value={allergens}>
  <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
    <header className="flex flex-wrap items-end justify-between gap-3 mb-4">
      <div>
        <h1 className="text-3xl font-semibold tracking-tight">Grocery intelligence</h1>
        <p className="text-stone-500 text-sm mt-1">
          <span title="Total recipes across all sources">{RECIPES.length} recipes</span>
          {" · "}
          <span title="Items currently tracked in your pantry">{pantry.length} pantry items</span>
          {" · "}
          <span title="Pantry items expiring in 5 days or fewer">{expiringCount} expiring soon</span>
          {" · "}
          <span title="Recipes you've marked cooked in this browser">{cooked.length} cooked</span>
          {" · "}
          <span title="Tesco deliveries parsed from receipt emails">{orderCount} orders</span>
        </p>
      </div>
      <div className="text-xs text-stone-500 mono flex flex-col items-end gap-1">
        <span>snapshot {GENERATED_AT}</span>
        <div className="flex gap-2">
          {!showHelpBanner && <button onClick={()=>setShowHelpBanner(true)} className="pill" title="Reopen the introduction panel">? Help</button>}
          <button onClick={exportAll} className="pill" title="Download your local-only data (cooked log + out-of-stock marks) as a JSON file. Paste it into a Claude session to update canonical state.">Export state</button>
          <button onClick={clearAll} className="pill" style={{color:"#dc2626"}} title="Clear cooked log and out-of-stock marks. Pantry snapshot is not affected — it comes from the embedded data.">Reset</button>
        </div>
      </div>
    </header>

    {showHelpBanner && <HelpBanner onDismiss={dismissHelpBanner}/>}

    {showStorageNote && !STORAGE_OK && <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800 mb-4 flex items-center justify-between">
      <span>⚠️ Browser storage is unavailable — your changes won't persist across reloads. This usually means the page is being viewed inside an iframe or sandbox. Download the file and open it directly to enable saving.</span>
      <button onClick={()=>setShowStorageNote(false)} className="text-xs underline">dismiss</button>
    </div>}

    <div className="flex flex-wrap gap-0 mb-1 border-b border-stone-200">
      {tabs.map(([k,l])=>
        <button key={k} data-active={tab===k} onClick={()=>setTab(k)} className="navtab">
          {l}
        </button>
      )}
    </div>
    {currentTabMeta && <div className="tab-subtitle">{currentTabMeta[2]}</div>}

    <LegendStrip/>

    {tab==="planner" && <PlannerView pantry={pantry} outOfStock={outOfStock} cooked={cooked}/>}
    {tab==="recipes" && <RecipesView pantry={pantry} outOfStock={outOfStock} cooked={cooked} addCooked={addCooked} eaterFilter={eaterFilter} setEaterFilter={setEaterFilter} cookedSyncErrors={cookedSyncErrors}/>}
    {tab==="pantry" && <PantryView pantry={pantry} outOfStock={outOfStock} toggleOutOfStock={toggleOutOfStock} qtyAdjustments={qtyAdjustments} adjustQty={adjustQty} syncErrors={syncErrors}/>}
    {tab==="tesco" && <OrdersView/>}
    {tab==="gaps" && <GapsView pantry={pantry} outOfStock={outOfStock}/>}
    {tab==="audit" && <AuditView pantry={pantry}/>}

    <footer className="text-xs text-stone-400 mt-8 text-center space-y-1">
      <div>State saved locally in your browser{STORAGE_OK ? " ✓" : " ✗"} · paste cooked log back into a Claude session for canonical pantry updates</div>
      <details className="inline-block">
        <summary className="cursor-pointer hover:text-stone-600 mono">v{SITE_VERSION} · changelog</summary>
        <div className="text-left mt-3 mx-auto max-w-2xl space-y-3 text-stone-600">
          {SITE_CHANGELOG.map((entry,i) => <div key={i} className="text-[11px]">
            <div className="mono text-stone-800 font-medium">{entry.version} <span className="text-stone-400">· {entry.date}</span></div>
            <ul className="list-disc ml-5 mt-1 space-y-0.5">
              {entry.changes.map((c,j) => <li key={j}>{c}</li>)}
            </ul>
          </div>)}
        </div>
      </details>
    </footer>
  </div>
  </AllergensContext.Provider>
  </ReceiptsContext.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
  <script>
  // Service worker is intentionally disabled. An earlier commit registered
  // one from `service-worker.js` but no one knows what it cached; the parked
  // items list flagged this as never-investigated. Combined with HTML-cache
  // staleness reported on 14.7, the simplest safe move is to actively kill
  // any registered SW on load and stop registering new ones. The browser
  // HTTP cache (handled by the no-cache meta tags in <head>) is the only
  // caching layer we want.
  //
  // This block runs on every page load and is idempotent — once all users
  // have visited once, no SWs remain. Cheap to leave in indefinitely.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(regs => {
        for (const reg of regs) {
          reg.unregister().then(ok => console.log('SW unregistered:', ok, reg.scope));
        }
      })
      .catch(err => console.warn('SW unregister check failed:', err));
  }
</script>
</body>
</html>
